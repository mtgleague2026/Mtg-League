<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premodern della Terra di Mezzo</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0b0a;
    --card: #17140f;
    --card-2: #1f1a12;
    --line: #3a2f1d;
    --text: #efe6d2;
    --muted: #a8997c;
    --gold: #d9b45a;
    --gold-hi: #f3d88e;
    --brass: #a87b32;
    --steel: #8fa3ad;
    --silver: #c9cfd3;
    --bronze: #c07a43;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.55;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(217,180,90,.10), transparent 70%),
      var(--bg);
    min-height: 100vh;
  }
  h1, h2, h3, nav button { font-family: Cinzel, Georgia, serif; }

  /* ---------- Testata ---------- */
  header { text-align: center; padding: 28px 16px 10px; }
  .logo {
    width: min(280px, 70vw); aspect-ratio: 1; display: block; margin: 0 auto;
    -webkit-mask-image: radial-gradient(circle, #000 63%, transparent 72%);
            mask-image: radial-gradient(circle, #000 63%, transparent 72%);
    filter: drop-shadow(0 0 30px rgba(217,180,90,.25));
  }
  header h1 {
    margin: 6px 0 0; font-size: clamp(1.35rem, 4.5vw, 2rem); font-weight: 700;
    letter-spacing: .06em;
    background: linear-gradient(180deg, var(--gold-hi), var(--brass));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }
  .ornamento {
    display: flex; align-items: center; gap: 12px; justify-content: center;
    color: var(--brass); margin: 14px auto 0; max-width: 320px;
  }
  .ornamento::before, .ornamento::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--brass), transparent);
  }

  /* ---------- Menu ---------- */
  nav {
    display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;
    padding: 12px 16px; position: sticky; top: 0; z-index: 2;
    background: rgba(12,11,10,.88); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  nav button {
    background: none; border: 1px solid var(--line); color: var(--muted);
    padding: 7px 14px; border-radius: 999px; cursor: pointer;
    font-size: .85rem; font-weight: 500; letter-spacing: .05em; transition: .2s;
  }
  nav button:hover { color: var(--gold); border-color: var(--brass); }
  nav button.attivo {
    color: #1a1308; border-color: var(--gold);
    background: linear-gradient(180deg, var(--gold-hi), var(--gold));
  }

  /* ---------- Contenuto ---------- */
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 40px; }
  section { display: none; animation: comparsa .35s ease; }
  section.attivo { display: block; }
  @keyframes comparsa { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  h2 {
    font-size: 1.25rem; margin: 0 0 16px; color: var(--gold); letter-spacing: .05em;
    display: flex; align-items: center; gap: 10px;
  }
  h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }

  .card {
    background: linear-gradient(180deg, var(--card-2), var(--card));
    border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 12px;
    box-shadow: inset 0 1px 0 rgba(243,216,142,.06);
  }
  .card strong { color: var(--text); }
  .card .meta { color: var(--muted); font-size: .88rem; margin: 2px 0 4px; }
  a { color: var(--gold); }

  /* Prossima tappa in evidenza */
  .prossima {
    position: relative; overflow: hidden; text-align: center;
    border-color: var(--brass); padding: 22px 18px;
    background:
      radial-gradient(circle at 50% -40%, rgba(217,180,90,.22), transparent 60%),
      linear-gradient(180deg, var(--card-2), var(--card));
  }
  .prossima .etichetta {
    font-size: .75rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted);
  }
  .prossima .nome { font-family: Cinzel, serif; font-size: 1.5rem; color: var(--gold-hi); margin: 4px 0; }
  .prossima .giorni {
    display: inline-block; margin-top: 10px; padding: 6px 16px; border-radius: 999px;
    border: 1px solid var(--brass); color: var(--gold); font-weight: 600; font-size: .9rem;
  }

  /* Classifica */
  .tabella-wrap { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; background: var(--card); }
  th, td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--line); }
  tbody tr:last-child td { border-bottom: none; }
  th { color: var(--muted); font-weight: 500; font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; background: var(--card-2); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.punti { color: var(--gold); font-weight: 600; }
  .pos {
    display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
    font-size: .8rem; font-weight: 600; color: var(--muted); border: 1px solid var(--line);
  }
  .pos-1 { background: linear-gradient(180deg, var(--gold-hi), var(--gold)); color: #1a1308; border: none; }
  .pos-2 { background: linear-gradient(180deg, #eef1f3, var(--silver)); color: #222; border: none; }
  .pos-3 { background: linear-gradient(180deg, #e3a06a, var(--bronze)); color: #1e1209; border: none; }
  .vuoto { color: var(--muted); text-align: center; padding: 24px; }

  /* Decklist */
  .deck { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .badge {
    flex-shrink: 0; font-size: .75rem; font-weight: 600; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--brass); color: var(--gold);
  }

  /* Regolamento */
  .card h3 { margin: 0 0 8px; font-size: 1.05rem; color: var(--gold); letter-spacing: .03em; }
  .card h4 { margin: 16px 0 6px; font-size: .95rem; color: var(--gold-hi); }
  .card p { margin: 6px 0; }
  .card ul, .card ol { margin: 6px 0; padding-left: 22px; }
  .card li { margin: 4px 0; }
  .card li::marker { color: var(--brass); }
  .scroll { overflow-x: auto; margin: 10px 0; border: 1px solid var(--line); border-radius: 8px; }
  .tab-reg { background: var(--bg); font-size: .88rem; }
  .tab-reg th, .tab-reg td { padding: 7px 10px; white-space: nowrap; }
  .formula {
    background: var(--bg); border-left: 3px solid var(--gold); padding: 9px 12px; border-radius: 0 6px 6px 0;
    font-family: ui-monospace, Menlo, monospace; font-size: .85rem; color: var(--gold-hi);
  }
  .esempio { color: var(--muted); font-style: italic; }
  .indice { columns: 2; column-gap: 24px; margin-top: 10px !important; }
  .indice a { text-decoration: none; }
  .indice a:hover { text-decoration: underline; }
  [id^="reg-"] { scroll-margin-top: 70px; }

  footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 0 16px 32px; }
  footer .aggiornato { margin-bottom: 4px; }
  .errore { background: #2a1314; border-color: #6b2e36; }

  @media (max-width: 520px) {
    .nascondi-mobile { display: none; }
    .indice { columns: 1; }
    th, td { padding: 10px; }
  }
</style>
</head>
<body>

<header>
  <img class="logo" src="logo.jpg" alt="Logo della lega">
  <h1 id="titolo">Premodern della Terra di Mezzo</h1>
  <p id="sottotitolo"></p>
  <div class="ornamento">⚙</div>
</header>

<nav>
  <button data-sezione="news" class="attivo">News</button>
  <button data-sezione="classifica">Classifica</button>
  <button data-sezione="eventi">Eventi</button>
  <button data-sezione="decklist">Decklist</button>
  <button data-sezione="regolamento">Regolamento</button>
  <button data-sezione="contatti">Contatti</button>
</nav>

<main>
  <section id="news" class="attivo">
    <div id="prossima-tappa"></div>
    <h2>Ultime novità</h2>
    <div id="lista-news"></div>
  </section>

  <section id="classifica">
    <h2>Classifica generale</h2>
    <div class="tabella-wrap">
      <table>
        <thead><tr>
          <th>#</th><th>Giocatore</th><th class="num">Punti</th>
          <th class="num nascondi-mobile">V-S-P</th>
        </tr></thead>
        <tbody id="tabella-classifica"></tbody>
      </table>
    </div>
  </section>

  <section id="eventi"><h2>Calendario</h2><div id="lista-eventi"></div></section>
  <section id="decklist"><h2>Decklist dei vincitori</h2><div id="lista-decklist"></div></section>
  <section id="regolamento"><h2>Regolamento</h2><div id="contenuto-regolamento"></div></section>
  <section id="contatti"><h2>Contatti</h2><div id="contenuto-contatti"></div></section>
</main>

<footer>
  <div class="aggiornato" id="aggiornato"></div>
  <div>Soresina · Premodern Magic: The Gathering</div>
</footer>

<script>
  // Navigazione tra le sezioni
  const mostra = id => {
    document.querySelectorAll("nav button, section").forEach(el => el.classList.remove("attivo"));
    document.querySelector(`nav button[data-sezione="${id}"]`).classList.add("attivo");
    document.getElementById(id).classList.add("attivo");
  };
  document.querySelectorAll("nav button").forEach(btn =>
    btn.addEventListener("click", () => mostra(btn.dataset.sezione)));

  // Evita che testo nei dati venga interpretato come HTML
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const dataIt = d => new Date(d).toLocaleDateString("it-IT", { weekday: "short", day: "numeric", month: "long" });
  const dataLunga = d => new Date(d).toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const vuoto = testo => `<div class="card vuoto">${testo}</div>`;

  fetch("data.json?v=" + Date.now(), { cache: "no-store" })
    .then(r => r.json())
    .then(d => {
      document.getElementById("titolo").textContent = d.nomeLega;
      document.getElementById("sottotitolo").textContent = d.sottotitolo;
      document.title = d.nomeLega;

      // Prossima tappa in evidenza (il primo evento da oggi in poi)
      const oggi = new Date(); oggi.setHours(0, 0, 0, 0);
      const futuri = d.eventi
        .filter(e => new Date(e.data + "T00:00") >= oggi)
        .sort((a, b) => a.data.localeCompare(b.data));
      if (futuri.length) {
        const e = futuri[0];
        const giorni = Math.round((new Date(e.data + "T00:00") - oggi) / 86400000);
        const quando = giorni === 0 ? "È oggi!" : giorni === 1 ? "Domani!" : `Mancano ${giorni} giorni`;
        document.getElementById("prossima-tappa").innerHTML = `
          <div class="card prossima">
            <div class="etichetta">Prossima tappa</div>
            <div class="nome">${esc(e.nome)}</div>
            <div class="meta">${dataLunga(e.data + "T00:00")} · ore ${esc(e.ora)}</div>
            <div>${esc(e.luogo)}</div>
            <div class="giorni">${quando}</div>
          </div>`;
      }

      document.getElementById("lista-news").innerHTML = d.news.map(n => `
        <div class="card"><strong>${esc(n.titolo)}</strong>
        <div class="meta">${dataIt(n.data)}</div><div>${esc(n.testo)}</div></div>`).join("");

      const ordinata = [...d.classifica].sort((a, b) => b.punti - a.punti);
      document.getElementById("tabella-classifica").innerHTML = ordinata.length
        ? ordinata.map((g, i) => `
          <tr><td><span class="pos pos-${i + 1}">${i + 1}</span></td><td>${esc(g.giocatore)}</td>
          <td class="num punti">${g.punti}</td>
          <td class="num nascondi-mobile">${g.vittorie}-${g.sconfitte}-${g.pareggi}</td></tr>`).join("")
        : `<tr><td colspan="4" class="vuoto">La classifica partirà con la prima tappa.</td></tr>`;

      document.getElementById("lista-eventi").innerHTML = d.eventi.length
        ? d.eventi.map(e => `
          <div class="card"><strong>${esc(e.nome)}</strong>
          <div class="meta">${dataIt(e.data + "T00:00")} · ore ${esc(e.ora)} · ${esc(e.formato)}</div>
          <div>${esc(e.luogo)}${e.note ? " — " + esc(e.note) : ""}</div></div>`).join("")
        : vuoto("Nessun evento in calendario.");

      document.getElementById("lista-decklist").innerHTML = d.decklist.length
        ? d.decklist.map(k => `
          <div class="card deck"><div><strong>${esc(k.mazzo)}</strong> — ${esc(k.giocatore)}
          <div class="meta">${esc(k.torneo)}</div>
          ${k.link ? `<a href="${esc(k.link)}" target="_blank" rel="noopener">Vedi lista</a>` : ""}</div>
          <span class="badge">${esc(k.piazzamento)}</span></div>`).join("")
        : vuoto("Le decklist arriveranno dopo la prima tappa.");

      // Regolamento: ogni "blocco" viene disegnato in base al suo tipo
      const lista = voci => voci.map(v => `<li>${esc(v)}</li>`).join("");
      const blocco = b => {
        switch (b.tipo) {
          case "paragrafo":      return `<p>${esc(b.testo)}</p>`;
          case "sottotitolo":    return `<h4>${esc(b.testo)}</h4>`;
          case "elenco":         return `<ul>${lista(b.voci)}</ul>`;
          case "elencoNumerato": return `<ol>${lista(b.voci)}</ol>`;
          case "formula":        return `<p class="formula">${esc(b.testo)}</p>`;
          case "esempio":        return `<p class="esempio"><strong>Esempio:</strong> ${esc(b.testo)}</p>`;
          case "tabella":        return `<div class="scroll"><table class="tab-reg">
            <thead><tr>${b.intestazioni.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
            <tbody>${b.righe.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody>
            </table></div>`;
          default: return "";
        }
      };
      const reg = d.regole;
      document.getElementById("contenuto-regolamento").innerHTML = `
        <div class="card"><strong>${esc(reg.titolo)}</strong>
          <div class="meta">Stagione ${esc(reg.stagione)} · aggiornato il ${esc(reg.ultimoAggiornamento)}</div>
          <ol class="indice">${reg.sezioni.map(s => `<li><a href="#reg-${esc(s.id)}">${esc(s.titolo)}</a></li>`).join("")}</ol>
        </div>
        ${reg.sezioni.map(s => `
          <div class="card" id="reg-${esc(s.id)}">
            <h3>${s.numero}. ${esc(s.titolo)}</h3>
            ${s.blocchi.map(blocco).join("")}
          </div>`).join("")}`;

      document.getElementById("contenuto-contatti").innerHTML = `
        <div class="card"><ul>${d.contatti.map(c => `<li><strong>${esc(c.nome)}</strong>: ${c.link ? `<a href="${esc(c.link)}" target="_blank" rel="noopener">${esc(c.testo)}</a>` : esc(c.testo)}</li>`).join("")}</ul></div>`;

      document.getElementById("aggiornato").textContent = "Ultimo aggiornamento: " + dataIt(d.ultimoAggiornamento + "T00:00");
    })
    .catch(() => {
      document.getElementById("lista-news").innerHTML = `
        <div class="card errore">Non riesco a leggere <strong>data.json</strong>.<br>
        Se hai aperto il file con un doppio clic dal computer è normale: il browser blocca la lettura
        dei file locali. Se invece sei online, probabilmente c'è un errore di sintassi nel file:
        incollalo su jsonlint.com per trovarlo.</div>`;
    });
</script>
</body>
</html>
