<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gestione sito</title>
<link rel="icon" href="favicon.png?v=4">
<style>
  :root {
    --bg: #0b0b0b; --card: #141414; --card-2: #181818; --line: #333331; --ink: #e6e6e6;
    --text: #ecece9; --muted: #9c9c97; --gold: #ededed; --gold-hi: #ffffff;
    --brass: #ededed; --ok: #7fcf8a; --err: #ff8a80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.45;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
    border-bottom: 1px solid var(--line); max-width: 900px; margin: 0 auto;
  }
  header img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
  header h1 { font-size: 1.1rem; margin: 0; color: var(--gold); }
  header .sub { color: var(--muted); font-size: .85rem; }
  header a { margin-left: auto; color: var(--gold); font-size: .9rem; white-space: nowrap; }
  main { max-width: 900px; margin: 0 auto; padding: 16px 16px 140px; }

  .card {
    background: linear-gradient(180deg, var(--card-2), var(--card));
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px;
  }
  .card h2 { margin: 0 0 8px; font-size: 1rem; color: var(--gold); }
  .muted { color: var(--muted); font-size: .88rem; }

  label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: 3px; letter-spacing: .02em; }
  input, textarea {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 10px; font: inherit; font-size: 16px;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--gold); }
  textarea { min-height: 110px; resize: vertical; }
  textarea.riga { min-height: 0; resize: none; overflow: hidden; line-height: 1.4; }
  textarea.regola { min-height: 220px; line-height: 1.5; font-size: 15px; }

  /* Regolamento */
  .guida { font-size: .88rem; }
  .guida summary { font-size: .92rem; }
  .guida table { border-collapse: collapse; margin-top: 10px; width: 100%; }
  .guida td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .guida td:first-child { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--gold-hi); white-space: pre; }
  .num-sezione { color: var(--gold); font-weight: 600; font-size: .95rem; margin-bottom: 8px; }

  /* Allegati delle Info utili */
  .allegati { display: flex; flex-direction: column; gap: 6px; }
  .allegato { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .allegato input { flex: 1; min-width: 0; padding: 6px 8px; }
  .allegato .peso { color: var(--muted); font-size: .78rem; white-space: nowrap; }
  .ext { flex-shrink: 0; font-size: .68rem; font-weight: 700; letter-spacing: .04em; padding: 3px 6px; border-radius: 4px; color: #0b0b0b; background: var(--ink); }
  .aggiungi-file { align-self: flex-start; border-style: dashed; border-color: var(--brass); color: var(--gold); background: transparent; }
  textarea.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; min-height: 150px; white-space: pre; }
  .aiuto { font-size: .78rem; color: var(--muted); margin-top: 4px; }
  .aiuto.ok { color: var(--ok); }
  .campi { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .campi .largo { grid-column: 1 / -1; }

  button {
    font: inherit; font-size: .9rem; cursor: pointer; border-radius: 8px; padding: 8px 14px;
    border: 1px solid var(--line); background: var(--card-2); color: var(--text);
  }
  button:hover { border-color: var(--brass); }
  button:disabled { opacity: .45; cursor: default; }
  button.primario {
    background: linear-gradient(180deg, var(--gold-hi), var(--gold)); color: #0b0b0b;
    border: none; font-weight: 600;
  }
  button.piccolo { padding: 5px 9px; font-size: .85rem; }
  button.elimina:hover { border-color: var(--err); color: var(--err); }

  .schede { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 14px; }
  .schede button.attivo { border-color: var(--gold); color: var(--gold); }

  .voce .azioni { display: flex; gap: 6px; justify-content: flex-end; margin-top: 10px; }

  .intesta { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .intesta h2 { margin: 0; }

  /* Foto delle news */
  .miniature { display: flex; flex-wrap: wrap; gap: 8px; }
  .mini {
    position: relative; width: 96px; height: 96px; border-radius: 8px; overflow: hidden;
    border: 1px solid var(--line); background: var(--bg);
  }
  .mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mini .nuova {
    position: absolute; top: 4px; left: 4px; font-size: .65rem; font-weight: 700; letter-spacing: .04em;
    background: var(--gold); color: #0b0b0b; padding: 1px 5px; border-radius: 4px;
  }
  .mini .comandi {
    position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between;
    background: linear-gradient(transparent, rgba(0,0,0,.85)); padding: 14px 3px 3px;
  }
  .mini .comandi button { padding: 1px 7px; font-size: .8rem; background: rgba(0,0,0,.6); border-color: rgba(255,255,255,.2); }
  .aggiungi-foto {
    width: 96px; height: 96px; border: 1px dashed var(--brass); border-radius: 8px; color: var(--gold);
    display: grid; place-items: center; text-align: center; cursor: pointer; font-size: .82rem; background: transparent;
  }
  .aggiungi-foto:hover { background: rgba(255,255,255,.05); }

  /* Classifica in forma di tabella compatta */
  .griglia { width: 100%; border-collapse: collapse; }
  .griglia th { text-align: left; font-size: .75rem; color: var(--muted); font-weight: 500; padding: 0 4px 6px; }
  .griglia td { padding: 3px 4px; }
  .griglia input { padding: 7px 8px; }
  .griglia .n { width: 60px; }
  .griglia td.nome input { min-width: 130px; }
  .griglia td.nick input { min-width: 100px; }
  .griglia input[type=number] { padding: 7px 4px; text-align: center; -moz-appearance: textfield; }
  .griglia input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  .griglia td:last-child { width: 1%; white-space: nowrap; }

  .barra {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: rgba(11,11,11,.95); backdrop-filter: blur(8px); border-top: 1px solid var(--line);
  }
  .barra .dentro {
    max-width: 900px; margin: 0 auto; padding: 12px 16px;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  #stato { flex: 1; min-width: 180px; font-size: .9rem; color: var(--muted); }
  #stato.ok { color: var(--ok); } #stato.err { color: var(--err); } #stato.mod { color: var(--gold-hi); }

  .nascosto { display: none !important; }
  .riga { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
  .riga > div { flex: 1; min-width: 200px; }
  details summary { cursor: pointer; color: var(--gold); }

  @media (max-width: 520px) {
    #stato { flex-basis: 100%; }
    .barra button { flex: 1; }
    .mini, .aggiungi-foto { width: calc(33.333% - 6px); height: auto; aspect-ratio: 1; }
  }
</style>
</head>
<body>

<header>
  <img src="logo.png?v=4" alt="">
  <div><h1>Gestione sito</h1><div class="sub" id="repo-label"></div></div>
  <a href="./" target="_blank">Apri il sito ↗</a>
</header>

<main>
  <!-- Accesso -->
  <div class="card" id="box-token">
    <h2>Accesso</h2>
    <p class="muted" style="margin-top:0">Incolla qui il tuo token GitHub. Viene ricordato solo su questo browser e non finisce mai sul sito pubblico.</p>
    <div class="riga">
      <div><label for="token">Token GitHub</label><input id="token" type="password" placeholder="github_pat_…" autocomplete="off"></div>
      <button class="primario" id="btn-accedi">Accedi</button>
    </div>
    <details style="margin-top:12px">
      <summary>Impostazioni avanzate</summary>
      <div class="campi" style="margin-top:10px">
        <div><label for="owner">Utente GitHub</label><input id="owner"></div>
        <div><label for="repo">Repository</label><input id="repo"></div>
        <div><label for="branch">Branch</label><input id="branch" value="main"></div>
      </div>
    </details>
  </div>

  <div class="card nascosto" id="box-connesso">
    <div class="intesta" style="margin:0">
      <span class="muted">Collegato a GitHub ✓</span>
      <span style="display:flex;gap:6px">
        <button class="piccolo" id="btn-ricarica" title="Rilegge i dati da GitHub">Ricarica dati</button>
        <button class="piccolo" id="btn-esci">Esci</button>
      </span>
    </div>
  </div>

  <div id="editor" class="nascosto">
    <div class="schede" id="schede"></div>
    <div id="pannello"></div>
  </div>
</main>

<div class="barra">
  <div class="dentro">
    <span id="stato">Inserisci il token per iniziare.</span>
    <button id="btn-scarica" class="nascosto" title="Scarica data.json come copia di sicurezza">Scarica data.json</button>
    <button id="btn-pubblica" class="primario" disabled>Pubblica</button>
  </div>
</div>

<input type="file" id="scegli-foto" accept="image/*" multiple hidden>
<input type="file" id="scegli-file" multiple hidden
  accept=".pdf,.doc,.docx,.odt,.rtf,.txt,.xls,.xlsx,.ods,.csv,.ppt,.pptx,.odp,.zip,image/*">

<script>
/* ======================= Impostazioni e memoria locale ======================= */
const mem = {
  get: k => { try { return localStorage.getItem("admin_" + k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem("admin_" + k, v); } catch {} },
  del: k => { try { localStorage.removeItem("admin_" + k); } catch {} },
};
const $ = id => document.getElementById(id);

// Utente e repository si ricavano dall'indirizzo: utente.github.io/repository/
const suGithub = location.hostname.endsWith(".github.io");
$("owner").value  = mem.get("owner")  || (suGithub ? location.hostname.split(".")[0] : "");
$("repo").value   = mem.get("repo")   || (suGithub ? location.pathname.split("/")[1] : "");
$("branch").value = mem.get("branch") || "main";

const cfg = () => ({ owner: $("owner").value.trim(), repo: $("repo").value.trim(), branch: $("branch").value.trim() || "main" });
const aggiornaEtichetta = () => { const c = cfg(); $("repo-label").textContent = c.owner && c.repo ? `${c.owner} / ${c.repo}` : ""; };
aggiornaEtichetta();

/* ======================= Stato ======================= */
let dati = null;        // contenuto di data.json
let sha = null;         // versione del file su GitHub (serve per salvare)
let modificato = false;
let schedaAttiva = "news";
const fotoInAttesa = new Map();   // percorso → { base64, anteprima } delle foto non ancora caricate
const fileInAttesa = new Map();   // percorso → base64 degli allegati non ancora caricati
let regEdit = null;               // regolamento in forma di testo semplice, per la modifica
let regToccato = false;           // il regolamento va riscritto in data.json solo se è stato modificato

function stato(testo, tipo = "") { const s = $("stato"); s.textContent = testo; s.className = tipo; }
function segnaModificato() {
  modificato = true;
  $("btn-pubblica").disabled = false;
  stato("Modifiche non ancora pubblicate", "mod");
}
window.addEventListener("beforeunload", e => { if (modificato) { e.preventDefault(); e.returnValue = ""; } });

/* ======================= GitHub ======================= */
const b64Encode = str => { const bytes = new TextEncoder().encode(str); let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b)); return btoa(bin); };
const b64Decode = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g, "")), c => c.charCodeAt(0)));

// Chiamata generica alle API GitHub del repository (percorso relativo a /repos/utente/repository/)
async function ghApi(percorso, metodo = "GET", corpo) {
  const { owner, repo } = cfg();
  const url = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/${percorso}`;
  const r = await fetch(url, {
    method: metodo, cache: "no-store",
    headers: {
      "Authorization": "Bearer " + mem.get("token"),
      "Accept": "application/vnd.github+json",
      ...(corpo ? { "Content-Type": "application/json" } : {}),
    },
    body: corpo ? JSON.stringify(corpo) : undefined,
  });
  if (!r.ok) {
    const msg = {
      401: "Token non valido o scaduto. Creane uno nuovo ed esci/rientra.",
      403: "Il token non ha il permesso di scrivere. Controlla che abbia «Contents: Read and write» su questo repository.",
      404: "Repository o file non trovato. Controlla le impostazioni avanzate e che il token abbia accesso a questo repository.",
      409: "Il file è stato modificato da un'altra parte nel frattempo. Premi «Ricarica dati» e rifai la modifica.",
      422: "GitHub ha rifiutato il salvataggio. Premi «Ricarica dati» e riprova.",
    }[r.status] || `Errore GitHub (${r.status}).`;
    throw new Error(msg);
  }
  return r.json();
}

// Legge o scrive data.json (ref = branch, oppure una versione precedente)
const gh = (metodo, corpo, ref = cfg().branch) => metodo === "GET"
  ? ghApi(`contents/data.json?ref=${encodeURIComponent(ref)}&t=${Date.now()}`)
  : ghApi("contents/data.json", metodo, corpo);

function preparaDati() {
  ["news", "eventi", "classifica", "decklist", "info", "contatti"].forEach(k => { if (!Array.isArray(dati[k])) dati[k] = []; });
  regEdit = daRegole(dati.regole);
  regToccato = false;
}

async function carica() {
  stato("Carico i dati da GitHub…");
  try {
    const f = await gh("GET");
    sha = f.sha;
    dati = JSON.parse(b64Decode(f.content));
    preparaDati();
    modificato = false;
    $("btn-pubblica").disabled = true;
    $("box-token").classList.add("nascosto");
    $("box-connesso").classList.remove("nascosto");
    $("editor").classList.remove("nascosto");
    $("btn-scarica").classList.remove("nascosto");
    disegna();
    stato("Dati caricati. Nessuna modifica in sospeso.", "ok");
  } catch (e) {
    stato(e.message, "err");
  }
}

async function pubblica() {
  $("btn-pubblica").disabled = true;
  try {
    // 1. controlla che nessuno abbia cambiato i dati nel frattempo
    stato("Pubblico…");
    const attuale = await gh("GET");
    if (attuale.sha !== sha) throw new Error("Il file su GitHub è cambiato da quando l'hai aperto. Premi «Ricarica dati» e rifai la modifica.");

    // 2. carica le foto nuove (solo quelle ancora usate in qualche news)
    const usate = new Set(dati.news.flatMap(n => n.foto || []));
    const daCaricare = [...fotoInAttesa.keys()].filter(p => usate.has(p));
    for (let i = 0; i < daCaricare.length; i++) {
      stato(`Carico le foto… ${i + 1} di ${daCaricare.length}`);
      const p = daCaricare[i];
      await ghApi("contents/" + p.split("/").map(encodeURIComponent).join("/"), "PUT", {
        message: "Foto news", content: fotoInAttesa.get(p).base64, branch: cfg().branch,
      });
      fotoInAttesa.delete(p);
    }

    // 2b. carica gli allegati nuovi delle Info utili (solo quelli ancora usati)
    const usati = new Set(dati.info.flatMap(x => (x.allegati || []).map(f => f.file)));
    const fileDaCaricare = [...fileInAttesa.keys()].filter(p => usati.has(p));
    for (let i = 0; i < fileDaCaricare.length; i++) {
      stato(`Carico gli allegati… ${i + 1} di ${fileDaCaricare.length}`);
      const p = fileDaCaricare[i];
      await ghApi("contents/" + p.split("/").map(encodeURIComponent).join("/"), "PUT", {
        message: "Allegato Info utili", content: fileInAttesa.get(p), branch: cfg().branch,
      });
      fileInAttesa.delete(p);
    }

    // 3. salva i dati
    applicaRegolamento();
    togliInglese();
    stato("Salvo i dati…");
    dati.ultimoAggiornamento = new Date().toLocaleDateString("sv-SE"); // formato AAAA-MM-GG
    const r = await gh("PUT", {
      message: "Aggiornamento dal pannello di gestione",
      content: b64Encode(JSON.stringify(dati, null, 2) + "\n"),
      sha, branch: cfg().branch,
    });
    sha = r.content.sha;
    modificato = false;
    const ora = new Date().toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
    stato(`Pubblicato alle ${ora} ✓ Il sito si aggiorna entro 1-2 minuti.`, "ok");
    if (schedaAttiva === "news") disegna();
  } catch (e) {
    $("btn-pubblica").disabled = false;
    stato(e.message, "err");
  }
}

/* ======================= Foto: ridimensionamento ======================= */
// Le foto vengono ridotte a 1600 px sul lato lungo e salvate in JPEG: pesano poco e si caricano in fretta.
async function preparaFoto(file) {
  let sorgente;
  try { sorgente = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch {
    sorgente = await new Promise((ok, ko) => {
      const img = new Image(); img.onload = () => ok(img); img.onerror = () => ko(new Error("Formato non supportato"));
      img.src = URL.createObjectURL(file);
    });
  }
  const max = 1600, w = sorgente.width, h = sorgente.height, s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement("canvas");
  c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext("2d").drawImage(sorgente, 0, 0, c.width, c.height);
  const anteprima = c.toDataURL("image/jpeg", 0.82);
  return { anteprima, base64: anteprima.split(",")[1] };
}
const nomeFoto = () => `foto/${new Date().toLocaleDateString("sv-SE")}-${Math.random().toString(36).slice(2, 8)}.jpg`;

/* ======================= Struttura delle sezioni ======================= */
const oggi = () => new Date().toLocaleDateString("sv-SE");
const SEZIONI = {
  news: {
    nome: "News", aggiungi: "Nuova news", inCima: true,
    campi: [["data", "date", "Data"], ["titolo", "riga", "Titolo", "largo"], ["testo", "textarea", "Testo", "largo"], ["foto", "foto", "Foto", "largo"]],
    nuovo: () => ({ data: oggi(), titolo: "", testo: "", foto: [] }),
  },
  eventi: {
    nome: "Eventi", aggiungi: "Nuovo evento",
    campi: [["nome", "text", "Nome (es. S1E2)"], ["data", "date", "Data"], ["ora", "time", "Ora"], ["formato", "text", "Formato"],
            ["luogo", "riga", "Luogo", "largo"], ["note", "riga", "Note", "largo"],
            ["linkDecklist", "url", "Link alle decklist dell'evento (MTGTop8, TCDecks…)", "largo"],
            ["classifica", "classifica", "Classifica della tappa (incolla dal gestionale)", "largo"]],
    nuovo: () => ({ data: oggi(), ora: "13:30", nome: "", formato: "Premodern", luogo: "", note: "", linkDecklist: "", classifica: "" }),
  },
  classifica: { nome: "Classifica", aggiungi: "Aggiungi giocatore" },
  decklist: {
    nome: "Decklist", aggiungi: "Nuova decklist", inCima: true,
    campi: [["torneo", "tappa", "Tappa / torneo"], ["piazzamento", "text", "Piazzamento"], ["giocatore", "text", "Giocatore"],
            ["mazzo", "text", "Nome del mazzo"], ["archetipo", "archetipo", "Archetipo (per raggruppare: es. Burn, Stasis)"],
            ["lista", "lista", "Lista del mazzo", "largo"]],
    nuovo: () => ({ torneo: "", giocatore: "", mazzo: "", archetipo: "", piazzamento: "1° posto", lista: "" }),
  },
  info: {
    nome: "Info utili", aggiungi: "Nuova info",
    campi: [["titolo", "riga", "Titolo (es. Come inviare la lista per la top 8)", "largo"],
            ["testo", "textarea", "Testo — lascia una riga vuota per andare a capo con un nuovo paragrafo; link ed e-mail diventano cliccabili", "largo"],
            ["allegati", "allegati", "File scaricabili (PDF, Word, Excel…)", "largo"]],
    nuovo: () => ({ titolo: "", testo: "", allegati: [] }),
  },
  contatti: {
    nome: "Contatti", aggiungi: "Nuovo contatto",
    campi: [["nome", "text", "Voce (es. Instagram)"], ["testo", "riga", "Testo mostrato"], ["link", "url", "Link (facoltativo, con https://)", "largo"]],
    nuovo: () => ({ nome: "", testo: "", link: "" }),
  },
  regolamento: { nome: "Regolamento" },
  privacy: { nome: "Privacy" },
  generale: { nome: "Testata" },
  versioni: { nome: "↺ Versioni" },
};

/* ======================= Disegno dell'interfaccia ======================= */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function disegna() {
  $("schede").innerHTML = Object.entries(SEZIONI).map(([k, s]) =>
    `<button data-k="${k}" class="${k === schedaAttiva ? "attivo" : ""}">${s.nome}</button>`).join("");
  $("schede").querySelectorAll("button").forEach(b => b.onclick = () => { schedaAttiva = b.dataset.k; disegna(); });

  const p = $("pannello");
  p.oninput = null;
  if (schedaAttiva === "generale") return disegnaGenerale(p);
  if (schedaAttiva === "classifica") return disegnaClassifica(p);
  if (schedaAttiva === "versioni") return disegnaVersioni(p);
  if (schedaAttiva === "regolamento") return disegnaRegolamento(p);
  if (schedaAttiva === "privacy") return disegnaPrivacy(p);
  disegnaLista(p, schedaAttiva);
}

// Riepilogo di ciò che è stato riconosciuto nel testo incollato
function contaLista(t) {
  let main = 0, side = 0, inSide = false;
  String(t || "").split("\n").forEach(r => {
    r = r.trim();
    if (/^(sideboard|side|sb)\s*:?\s*$/i.test(r)) { inSide = true; return; }
    const m = r.replace(/^sb:\s*/i, "").match(/^(\d+)\s*x?\s+\S/i);
    if (m) (inSide || /^sb:/i.test(r) ? side += +m[1] : main += +m[1]);
  });
  return main || side ? `Riconosciute: ${main} carte di main${side ? ` + ${side} di sideboard` : ""}. Una carta per riga, es. «4 Lightning Bolt»; scrivi «Sideboard» prima della sideboard.`
                      : "Una carta per riga, es. «4 Lightning Bolt»; scrivi «Sideboard» prima della sideboard.";
}
function contaClassifica(t) {
  const righe = String(t || "").split("\n").filter(r => r.trim());
  if (!righe.length) return "Copia la tabella dal gestionale e incollala qui: sul sito diventa una tabella.";
  const colonne = righe.some(r => r.includes("\t")) ? Math.max(...righe.map(r => r.split("\t").length)) : 0;
  return colonne > 1 ? `Riconosciute ${righe.length} righe × ${colonne} colonne ✓`
                     : `${righe.length} righe: sul sito verranno mostrate come testo.`;
}

const suggeriti = { tappa: "elenco-tappe", archetipo: "elenco-archetipi" };   // caselle con suggerimenti
function campo(oggetto, chiave, tipo, etichetta, extra) {
  const id = "f" + Math.random().toString(36).slice(2);
  const wrap = document.createElement("div");
  if (extra === "largo") wrap.className = "largo";
  if (tipo === "foto") { disegnaFoto(wrap, oggetto, etichetta); return wrap; }
  if (tipo === "allegati") { disegnaAllegati(wrap, oggetto, etichetta); return wrap; }

  const valore = oggetto[chiave] ?? "";
  const testoLungo = tipo === "textarea" || tipo === "lista" || tipo === "classifica" || tipo === "riga" || tipo === "regola" || tipo === "lungo";
  const mono = tipo === "lista" || tipo === "classifica";
  wrap.innerHTML = `<label for="${id}">${esc(etichetta)}</label>` +
    (testoLungo ? `<textarea id="${id}" class="${mono ? "mono" : tipo === "riga" || tipo === "regola" ? tipo : tipo === "lungo" ? "regola" : ""}" ${tipo === "riga" ? 'rows="1"' : ""} spellcheck="${!mono}">${esc(valore)}</textarea>`
                : `<input id="${id}" type="${suggeriti[tipo] ? "text" : tipo}" ${suggeriti[tipo] ? `list="${suggeriti[tipo]}" autocomplete="off"` : ""} value="${esc(valore)}">`);
  const aiuto = { lista: contaLista, classifica: contaClassifica, regola: riepilogoBlocchi }[tipo];
  let nota;
  if (aiuto) { nota = document.createElement("div"); nota.className = "aiuto"; nota.textContent = aiuto(valore); wrap.appendChild(nota); }
  const casella = wrap.querySelector("input,textarea");
  if (tipo === "riga") {
    // la casella parte da una riga e si allunga se vai a capo con Invio
    const adatta = () => {
      if (!casella.offsetParent) return;          // nascosta (es. riquadro inglese chiuso): si adatta quando si apre
      casella.style.height = "auto"; casella.style.height = casella.scrollHeight + 2 + "px";
    };
    casella._adatta = adatta;
    casella.addEventListener("input", adatta);
    requestAnimationFrame(adatta);
  }
  casella.addEventListener("input", e => {
    oggetto[chiave] = e.target.value;
    if (nota) { nota.textContent = aiuto(e.target.value); nota.classList.toggle("ok", /✓|Riconosciute/.test(nota.textContent)); }
    segnaModificato();
  });
  return wrap;
}

/* ======================= Regolamento: testo semplice ⇄ blocchi ======================= */
// Convenzioni (una riga vuota separa i blocchi):
//   ## Sottotitolo          - voce di elenco          1. voce numerata
//   = formula               Esempio: testo            colonna | colonna | colonna  (tabella, prima riga = intestazioni)
//   qualsiasi altra riga    → paragrafo (le righe consecutive restano nello stesso paragrafo, con l'a capo)
function blocchiATesto(blocchi, en) {
  return (blocchi || []).map(b => {
    switch (b.tipo) {
      case "sottotitolo":    return "## " + b.testo;
      case "elenco":         return b.voci.map(v => "- " + v).join("\n");
      case "elencoNumerato": return b.voci.map((v, i) => `${i + 1}. ${v}`).join("\n");
      case "formula":        return "= " + b.testo;
      case "esempio":        return (en ? "Example: " : "Esempio: ") + b.testo;
      case "tabella":        return [b.intestazioni, ...b.righe].map(r => r.join(" | ")).join("\n");
      default:               return b.testo || "";
    }
  }).join("\n\n");
}

function testoABlocchi(testo) {
  const blocchi = [];
  let cur = null;
  const chiudi = () => {
    if (!cur) return;
    if (cur.tipo === "tabella") {
      const righe = cur.righe.map(r => r.split("|").map(c => c.trim()));
      if (righe.length < 2) blocchi.push({ tipo: "paragrafo", testo: cur.righe.join("\n") });
      else blocchi.push({ tipo: "tabella", intestazioni: righe[0], righe: righe.slice(1) });
    } else if (cur.tipo === "paragrafo") blocchi.push({ tipo: "paragrafo", testo: cur.righe.join("\n") });
    else blocchi.push({ tipo: cur.tipo, voci: cur.righe });
    cur = null;
  };
  const accoda = (tipo, riga) => { if (!cur || cur.tipo !== tipo) { chiudi(); cur = { tipo, righe: [] }; } cur.righe.push(riga); };
  String(testo || "").replace(/\r/g, "").split("\n").forEach(r => {
    const t = r.trim();
    let m;
    if (!t) return chiudi();
    if ((m = t.match(/^#{2,3}\s+(.*)$/)))                 { chiudi(); blocchi.push({ tipo: "sottotitolo", testo: m[1] }); return; }
    if ((m = t.match(/^=\s+(.*)$/)))                      { chiudi(); blocchi.push({ tipo: "formula", testo: m[1] }); return; }
    if ((m = t.match(/^(?:esempio|example)\s*:\s*(.*)$/i))) { chiudi(); blocchi.push({ tipo: "esempio", testo: m[1] }); return; }
    if ((m = t.match(/^[-•*]\s+(.*)$/)))                  return accoda("elenco", m[1]);
    if ((m = t.match(/^\d+[.)]\s+(.*)$/)))                return accoda("elencoNumerato", m[1]);
    if (t.includes("|"))                                  return accoda("tabella", t);
    accoda("paragrafo", t);
  });
  chiudi();
  return blocchi;
}

// Breve riepilogo di ciò che è stato riconosciuto (mostrato sotto la casella)
function riepilogoBlocchi(testo) {
  const nomi = { paragrafo: ["paragrafo", "paragrafi"], sottotitolo: ["sottotitolo", "sottotitoli"], elenco: ["elenco", "elenchi"],
                 elencoNumerato: ["elenco numerato", "elenchi numerati"], formula: ["formula", "formule"],
                 esempio: ["esempio", "esempi"], tabella: ["tabella", "tabelle"] };
  const conta = {};
  testoABlocchi(testo).forEach(b => conta[b.tipo] = (conta[b.tipo] || 0) + 1);
  const parti = Object.entries(conta).map(([k, n]) => `${n} ${nomi[k][n === 1 ? 0 : 1]}`);
  return parti.length ? "Riconosciuti: " + parti.join(", ") + " ✓" : "Sezione vuota.";
}

/* ======================= Allegati delle Info utili ======================= */
const MAX_MB = 25;
const estensione = n => (String(n).match(/\.([a-z0-9]{1,5})$/i) || [, ""])[1].toLowerCase();
const famiglia = ext => ({ pdf: "pdf", doc: "doc", docx: "doc", odt: "doc", rtf: "doc", txt: "doc", xls: "xls", xlsx: "xls", ods: "xls", csv: "xls",
  ppt: "ppt", pptx: "ppt", odp: "ppt", jpg: "img", jpeg: "img", png: "img", gif: "img", webp: "img" }[ext] || "");
const peso = b => b >= 1048576 ? (b / 1048576).toFixed(1).replace(".", ",") + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
const nomeSicuro = n => n.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9.]+/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, "").slice(-60) || "file";
const leggiBase64 = file => new Promise((ok, ko) => {
  const fr = new FileReader(); fr.onload = () => ok(String(fr.result).split(",")[1]); fr.onerror = () => ko(fr.error); fr.readAsDataURL(file);
});

function disegnaAllegati(wrap, info, etichetta) {
  if (!Array.isArray(info.allegati)) info.allegati = [];
  const ridisegna = () => {
    wrap.innerHTML = `<label>${esc(etichetta)} <span class="muted">(${info.allegati.length})</span></label><div class="allegati"></div>`;
    const box = wrap.querySelector(".allegati");
    info.allegati.forEach((f, i) => {
      const ext = estensione(f.file);
      const riga = document.createElement("div");
      riga.className = "allegato";
      riga.innerHTML = `<span class="ext ${famiglia(ext)}">${esc(ext.toUpperCase() || "FILE")}</span>
        <input value="${esc(f.nome)}" title="Nome mostrato sul sito" aria-label="Nome mostrato sul sito">
        <span class="peso">${f.dimensione ? peso(f.dimensione) : ""}${fileInAttesa.has(f.file) ? " · NUOVO" : ""}</span>
        <button class="piccolo elimina" title="Togli allegato">✕</button>`;
      riga.querySelector("input").addEventListener("input", e => { f.nome = e.target.value; segnaModificato(); });
      riga.querySelector("button").onclick = () => {
        if (!confirm(`Togliere «${f.nome}» da questa info?`)) return;
        info.allegati.splice(i, 1); segnaModificato(); ridisegna();
      };
      box.appendChild(riga);
    });
    const add = document.createElement("button");
    add.className = "piccolo aggiungi-file"; add.textContent = "+ Aggiungi file";
    add.onclick = () => {
      const input = $("scegli-file");
      input.value = "";
      input.onchange = async () => {
        const scelti = [...input.files]; if (!scelti.length) return;
        for (let i = 0; i < scelti.length; i++) {
          const file = scelti[i];
          if (file.size > MAX_MB * 1048576) { alert(`«${file.name}» pesa ${peso(file.size)}: il limite è ${MAX_MB} MB.`); continue; }
          stato(`Preparo i file… ${i + 1} di ${scelti.length}`);
          try {
            const percorso = `file/${new Date().toLocaleDateString("sv-SE")}-${Math.random().toString(36).slice(2, 6)}-${nomeSicuro(file.name)}`;
            fileInAttesa.set(percorso, await leggiBase64(file));
            info.allegati.push({ nome: file.name.replace(/\.[^.]+$/, ""), file: percorso, dimensione: file.size });
          } catch { alert(`Non riesco a leggere «${file.name}».`); }
        }
        segnaModificato(); ridisegna();
      };
      input.click();
    };
    box.appendChild(add);
  };
  ridisegna();
}

/* ======================= Decklist: importazione dal messaggio ricevuto ======================= */
// Formato: Nome cognome / Nome del mazzo / Piazzamento, riga vuota, poi "4 Carta" e "SB: 2 Carta"
const RIGA_CARTA = /^(SB:\s*)?(\d+)\s*x?\s+(.+?)\s*$/i;
function leggiMessaggio(testo) {
  const intestazione = [], carte = []; let inSide = false;
  String(testo || "").replace(/\r/g, "").split("\n").map(r => r.trim()).forEach(r => {
    if (!r) return;
    if (/^(sideboard|side|sb)\s*:?\s*$/i.test(r)) { inSide = true; return; }
    const m = r.match(RIGA_CARTA);
    if (m) carte.push(`${m[1] || inSide ? "SB: " : ""}${m[2]} ${m[3]}`);
    else if (!carte.length) intestazione.push(r);
  });
  return { giocatore: intestazione[0] || "", mazzo: intestazione[1] || "", piazzamento: intestazione[2] || "", lista: carte.join("\n") };
}
function disegnaImportaLista(p) {
  const tappe = [...dati.eventi].sort((x, y) => String(y.data).localeCompare(String(x.data)));
  const archetipi = [...new Set(dati.decklist.map(x => x.archetipo || x.mazzo).filter(Boolean))].sort();
  p.insertAdjacentHTML("beforeend", `
    <datalist id="elenco-tappe">${tappe.map(e => `<option value="${esc(e.nome)}">`).join("")}</datalist>
    <datalist id="elenco-archetipi">${archetipi.map(x => `<option value="${esc(x)}">`).join("")}</datalist>
    <div class="card">
      <h2>Importa una lista ricevuta</h2>
      <p class="muted" style="margin-top:0">Incolla qui il messaggio del giocatore (quello generato dalla pagina «Compila lista»): nome, mazzo, piazzamento e carte si compilano da soli.</p>
      <div class="campi">
        <div><label for="imp-tappa">Tappa / torneo</label><input id="imp-tappa" list="elenco-tappe" autocomplete="off" value="${esc(tappe[0] ? tappe[0].nome : "")}"></div>
        <div><label for="imp-archetipo">Archetipo (facoltativo)</label><input id="imp-archetipo" list="elenco-archetipi" autocomplete="off"></div>
        <div class="largo"><label for="imp-testo">Messaggio</label><textarea id="imp-testo" class="mono" spellcheck="false" placeholder="Mario Rossi&#10;Burn&#10;1° posto&#10;&#10;4 Lightning Bolt&#10;20 Mountain&#10;SB: 3 Pyroblast"></textarea></div>
      </div>
      <div class="aiuto" id="imp-esito"></div>
      <div class="azioni" style="justify-content:flex-start"><button class="primario" id="imp-vai">Importa come nuova decklist</button></div>
    </div>`);
  const anteprima = () => {
    const m = leggiMessaggio($("imp-testo").value);
    $("imp-esito").className = "aiuto";
    $("imp-esito").textContent = $("imp-testo").value.trim()
      ? `${m.giocatore || "(manca il nome)"} · ${m.mazzo || "(manca il mazzo)"} · ${m.piazzamento || "(manca il piazzamento)"} — ${contaLista(m.lista).split(".")[0]}`
      : "";
  };
  $("imp-testo").addEventListener("input", anteprima);
  $("imp-vai").onclick = () => {
    const m = leggiMessaggio($("imp-testo").value);
    if (!m.lista) { $("imp-esito").className = "aiuto"; $("imp-esito").style.color = "var(--err)"; $("imp-esito").textContent = "Non trovo righe del tipo «4 Lightning Bolt»."; return; }
    dati.decklist.unshift({ torneo: $("imp-tappa").value.trim(), giocatore: m.giocatore, mazzo: m.mazzo,
      archetipo: $("imp-archetipo").value.trim(), piazzamento: m.piazzamento, lista: m.lista });
    segnaModificato(); disegna();
    stato(`Lista di ${m.giocatore || "un giocatore"} importata: controllala e premi Pubblica.`, "mod");
    p.querySelector(".voce")?.scrollIntoView({ behavior: "smooth", block: "center" });
  };
}

/* ======================= Informativa privacy ======================= */
const BOZZA_PRIVACY = `## Chi tratta i dati

- le liste dei mazzi (decklist) dei giocatori arrivati in top 8, con nome, mazzo e piazzamento;
- foto scattate durante le tappe.

Pubblichiamo risultati, classifiche e liste perché fanno parte dell'organizzazione della lega a cui scegli di partecipare (art. 6, par. 1, lett. b e f del Regolamento UE 2016/679, «GDPR»).
Le foto in cui sei riconoscibile vengono pubblicate solo con il tuo consenso (art. 6, par. 1, lett. a). Puoi dirci in ogni momento che non vuoi essere fotografato o pubblicato.
Per i partecipanti minorenni serve il consenso di un genitore o di chi ne esercita la responsabilità per la pubblicazione delle foto [e del nome].

## La pagina «Compila lista»
La pagina non salva e non invia nulla: il testo viene creato sul tuo dispositivo e sei tu a copiarlo nella chat. La bozza resta salvata solo nel tuo browser.
Per mostrare suggerimenti e immagini delle carte, il browser contatta il servizio Scryfall (scryfall.com), che riceve il tuo indirizzo IP e i nomi delle carte cercate.

## Il sito
Il sito è ospitato su GitHub Pages (GitHub, Inc., Stati Uniti), che registra dati tecnici come l'indirizzo IP per motivi di sicurezza. I caratteri tipografici sono caricati da Google Fonts (Google). Le immagini delle carte nelle decklist provengono da Scryfall.
Il sito non usa cookie di profilazione né strumenti di statistica. Nel tuo browser vengono salvate solo preferenze tecniche (per esempio suono acceso o spento, bozza della lista), che puoi cancellare quando vuoi.

## Per quanto tempo
Classifiche, risultati e liste restano pubblicati per la stagione in corso e come archivio della lega, salvo tua richiesta di rimozione. [Da completare]

## I tuoi diritti
Puoi chiedere in qualsiasi momento di accedere ai tuoi dati, correggerli o cancellarli, di comparire solo con il nickname o di togliere una foto, scrivendo a [contatto]. Hai anche il diritto di presentare reclamo al Garante per la protezione dei dati personali (www.garanteprivacy.it).`;

function disegnaPrivacy(p) {
  if (!dati.privacy) {
    dati.privacy = { aggiornata: "", testo: BOZZA_PRIVACY };
    segnaModificato();
    stato("Bozza dell'informativa caricata: completa le parti tra [ ] e premi Pubblica.", "mod");
  }
  p.innerHTML = `<div class="intesta"><h2 style="color:var(--gold)">Informativa privacy</h2></div>
    <div class="card muted" style="margin-bottom:12px">
      Sul sito compare come collegamento «Privacy» in fondo alla pagina. Completa le parti tra <strong>[ ]</strong> prima di pubblicare.
      Scrittura: una riga vuota separa i paragrafi, <strong>## </strong> all'inizio della riga crea un titoletto, <strong>- </strong> crea un elenco.
      È una bozza: per la versione definitiva è consigliabile farla rivedere da una persona competente.
    </div>
    <div class="card"><div class="campi" id="campi-privacy"></div></div>`;
  $("campi-privacy").appendChild(campo(dati.privacy, "aggiornata", "riga", "Aggiornata il (es. 6 novembre 2026)"));
  $("campi-privacy").appendChild(campo(dati.privacy, "testo", "lungo", "Testo", "largo"));
  const rimasti = (dati.privacy.testo.match(/\[[^\]]+\]/g) || []).length;
  if (rimasti) $("campi-privacy").insertAdjacentHTML("beforeend", `<div class="aiuto largo" style="color:var(--err)">Restano ${rimasti} parti da completare tra [ ].</div>`);
}

/* ======================= Versioni precedenti ======================= */
const quando = iso => new Date(iso).toLocaleString("it-IT", { weekday: "short", day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });

async function disegnaVersioni(p) {
  p.innerHTML = `<div class="intesta"><h2 style="color:var(--gold)">Versioni precedenti</h2></div>
    <div class="card muted" style="margin-bottom:12px">
      Ogni pubblicazione viene conservata. «Ripristina» carica quella versione nel pannello:
      controlla che sia giusta e premi <strong>Pubblica</strong> per rimetterla online.
      Finché non pubblichi, il sito non cambia.
    </div>
    <div id="lista-versioni"><div class="card muted">Carico l'elenco…</div></div>`;
  try {
    const commit = await ghApi(`commits?path=data.json&sha=${encodeURIComponent(cfg().branch)}&per_page=30&t=${Date.now()}`);
    if (schedaAttiva !== "versioni") return; // l'utente ha cambiato scheda nel frattempo
    const box = $("lista-versioni");
    if (!commit.length) { box.innerHTML = `<div class="card muted">Nessuna versione trovata.</div>`; return; }
    box.innerHTML = "";
    commit.forEach((c, i) => {
      const card = document.createElement("div");
      card.className = "card intesta";
      card.style.marginBottom = "8px";
      card.innerHTML = `
        <div>
          <strong>${quando(c.commit.author.date)}</strong>${i === 0 ? ` <span class="muted">· online adesso</span>` : ""}
          <div class="muted">${esc(c.commit.message.split("\n")[0])}</div>
        </div>
        ${i === 0 ? "" : `<button class="piccolo">Ripristina</button>`}`;
      card.querySelector("button")?.addEventListener("click", () => ripristina(c));
      box.appendChild(card);
    });
  } catch (e) {
    $("lista-versioni").innerHTML = `<div class="card" style="color:var(--err)">${esc(e.message)}</div>`;
  }
}

async function ripristina(c) {
  const data = quando(c.commit.author.date);
  if (modificato && !confirm("Hai modifiche non pubblicate: verranno sostituite. Continuare?")) return;
  if (!confirm(`Caricare la versione del ${data}?\nPotrai controllarla prima di pubblicarla.`)) return;
  stato("Carico la versione…");
  try {
    const f = await gh("GET", null, c.sha);
    dati = JSON.parse(b64Decode(f.content));
    preparaDati();
    schedaAttiva = "classifica";
    disegna();
    segnaModificato();
    stato(`Versione del ${data} caricata. Controlla e premi Pubblica per rimetterla online.`, "mod");
  } catch (e) {
    stato(e.message, "err");
  }
}

  mem.set("token", t); mem.set("owner", c.owner); mem.set("repo", c.repo); mem.set("branch", c.branch);

};
