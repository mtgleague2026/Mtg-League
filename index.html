<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premodern delle Lande Desolate</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070b14;
    --card: #0d1524;
    --card-2: #132036;
    --line: #263a58;
    --text: #e8f0f8;
    --muted: #8ea4c0;
    --gold: #8fd3ec;
    --gold-hi: #dff4fc;
    --brass: #4f86c6;
    --silver: #c9cfd3;
    --bronze: #c07a43;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.55;
    background:
      radial-gradient(ellipse 70% 45% at 25% -5%, rgba(46,196,160,.16), transparent 70%),
      radial-gradient(ellipse 60% 40% at 80% 0%, rgba(79,134,198,.22), transparent 70%),
      radial-gradient(ellipse 90% 60% at 50% 110%, rgba(61,111,224,.10), transparent 70%),
      var(--bg);
    background-attachment: fixed;
    min-height: 100vh;
  }
  /* cielo stellato leggero */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .55;
    background-image:
      radial-gradient(1px 1px at 23px 41px, #fff, transparent),
      radial-gradient(1px 1px at 97px 133px, #cfe9ff, transparent),
      radial-gradient(1.5px 1.5px at 171px 62px, #fff, transparent),
      radial-gradient(1px 1px at 233px 201px, #bfe3ff, transparent),
      radial-gradient(1px 1px at 61px 247px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 143px 289px, #dff4fc, transparent),
      radial-gradient(1px 1px at 281px 113px, #fff, transparent);
    background-size: 300px 300px;
    -webkit-mask-image: linear-gradient(#000, transparent 75%); mask-image: linear-gradient(#000, transparent 75%);
  }
  h1, h2, h3, nav button, dialog .titolo { font-family: Cinzel, Georgia, serif; }

  /* ---------- Testata ---------- */
  header { text-align: center; padding: 28px 16px 10px; }
  .logo {
    width: min(280px, 70vw); aspect-ratio: 1; display: block; margin: 0 auto;
    filter: drop-shadow(0 0 28px rgba(143,211,236,.35)) drop-shadow(0 0 60px rgba(61,111,224,.25));
  }
  header h1 {
    margin: 6px 0 0; font-size: clamp(1.35rem, 4.5vw, 2rem); font-weight: 700;
    letter-spacing: .06em;
    background: linear-gradient(180deg, var(--gold-hi), var(--brass));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }
  .ornamento {
    display: flex; align-items: center; gap: 12px; justify-content: center;
    color: var(--brass); margin: 14px auto 0; max-width: 320px;
  }
  .ornamento::before, .ornamento::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--brass), transparent);
  }

  /* ---------- Menu ---------- */
  nav {
    display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;
    padding: 12px 16px; position: sticky; top: 0; z-index: 2;
    background: rgba(7,11,20,.88); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  nav button {
    background: none; border: 1px solid var(--line); color: var(--muted);
    padding: 7px 14px; border-radius: 999px; cursor: pointer;
    font-size: .85rem; font-weight: 500; letter-spacing: .05em; transition: .2s;
  }
  nav button:hover { color: var(--gold); border-color: var(--brass); }
  nav button.attivo {
    color: #07111f; border-color: var(--gold);
    background: linear-gradient(180deg, var(--gold-hi), var(--gold));
  }

  /* ---------- Contenuto ---------- */
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 40px; }
  section { display: none; animation: comparsa .35s ease; }
  section.attivo { display: block; }
  @keyframes comparsa { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  h2 {
    font-size: 1.25rem; margin: 0 0 16px; color: var(--gold); letter-spacing: .05em;
    display: flex; align-items: center; gap: 10px;
  }
  h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
  h2.secondario { font-size: 1.05rem; color: var(--muted); margin-top: 28px; }

  .card {
    background: linear-gradient(180deg, var(--card-2), var(--card));
    border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 12px;
    box-shadow: inset 0 1px 0 rgba(223,244,252,.06);
  }
  .card strong { color: var(--text); }
  .card .meta { color: var(--muted); font-size: .88rem; margin: 2px 0 4px; }
  .card.passato { opacity: .82; }
  a { color: var(--gold); }

  /* Pulsanti dentro le card */
  .azioni { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    font: inherit; font-size: .85rem; font-weight: 500; cursor: pointer;
    padding: 6px 13px; border-radius: 999px; transition: .2s;
    background: transparent; color: var(--gold); border: 1px solid var(--brass);
  }
  .btn:hover { background: rgba(143,211,236,.12); }

  /* Prossima tappa in evidenza */
  .prossima {
    position: relative; overflow: hidden; text-align: center;
    border-color: var(--brass); padding: 22px 18px;
    background:
      radial-gradient(circle at 50% -40%, rgba(143,211,236,.22), transparent 60%),
      linear-gradient(180deg, var(--card-2), var(--card));
  }
  .prossima .etichetta { font-size: .75rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .prossima .nome { font-family: Cinzel, serif; font-size: 1.5rem; color: var(--gold-hi); margin: 4px 0; }
  .prossima .giorni {
    display: inline-block; margin-top: 10px; padding: 6px 16px; border-radius: 999px;
    border: 1px solid var(--brass); color: var(--gold); font-weight: 600; font-size: .9rem;
  }

  /* Foto delle news */
  .foto { display: grid; gap: 6px; margin-top: 12px; border-radius: 10px; overflow: hidden; }
  .foto.n1 { grid-template-columns: 1fr; }
  .foto.n2 { grid-template-columns: 1fr 1fr; }
  .foto.n3 { grid-template-columns: repeat(3, 1fr); }
  .foto button {
    position: relative; padding: 0; border: 0; cursor: zoom-in; background: var(--bg);
    aspect-ratio: 1; overflow: hidden; display: block;
  }
  .foto.n1 button { aspect-ratio: 16 / 10; }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
  .foto button:hover img { transform: scale(1.04); }
  .foto .altre {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(0,0,0,.55); color: #fff; font-size: 1.4rem; font-weight: 600;
  }

  /* Classifica */
  .cerca { position: relative; margin-bottom: 12px; }
  .cerca input {
    width: 100%; font: inherit; font-size: 16px; color: var(--text);
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 10px 16px 10px 40px;
  }
  .cerca input:focus { outline: none; border-color: var(--gold); }
  .cerca input::-webkit-search-cancel-button { filter: sepia(1) saturate(3) hue-rotate(5deg); cursor: pointer; }
  .cerca::before {
    content: "⌕"; position: absolute; left: 15px; top: 50%; transform: translateY(-52%);
    color: var(--muted); font-size: 1.15rem; pointer-events: none;
  }
  .tabella-wrap { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; background: var(--card); }
  th, td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--line); }
  tbody tr:last-child td { border-bottom: none; }
  th { color: var(--muted); font-weight: 500; font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; background: var(--card-2); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.punti { color: var(--gold); font-weight: 600; }
  .nick { display: block; color: var(--muted); font-size: .82rem; }
  .pos {
    display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
    font-size: .8rem; font-weight: 600; color: var(--muted); border: 1px solid var(--line);
  }
  .pos-1 { background: linear-gradient(180deg, var(--gold-hi), var(--gold)); color: #07111f; border: none; }
  .pos-2 { background: linear-gradient(180deg, #eef1f3, var(--silver)); color: #222; border: none; }
  .pos-3 { background: linear-gradient(180deg, #e3a06a, var(--bronze)); color: #1e1209; border: none; }
  .vuoto { color: var(--muted); text-align: center; padding: 24px; }
  .muted { color: var(--muted); }

  /* Decklist */
  .deck { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .badge {
    flex-shrink: 0; font-size: .75rem; font-weight: 600; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--brass); color: var(--gold);
  }

  /* Regolamento */
  .card h3 { margin: 0 0 8px; font-size: 1.05rem; color: var(--gold); letter-spacing: .03em; }
  .card h4 { margin: 16px 0 6px; font-size: .95rem; color: var(--gold-hi); }
  .card p { margin: 6px 0; }
  .card ul, .card ol { margin: 6px 0; padding-left: 22px; }
  .card li { margin: 4px 0; }
  .card li::marker { color: var(--brass); }
  .scroll { overflow-x: auto; margin: 10px 0; border: 1px solid var(--line); border-radius: 8px; }
  .tab-reg { background: var(--bg); font-size: .88rem; }
  .tab-reg th, .tab-reg td { padding: 7px 10px; white-space: nowrap; }
  .formula {
    background: var(--bg); border-left: 3px solid var(--gold); padding: 9px 12px; border-radius: 0 6px 6px 0;
    font-family: ui-monospace, Menlo, monospace; font-size: .85rem; color: var(--gold-hi);
  }
  .esempio { color: var(--muted); font-style: italic; }
  .indice { columns: 2; column-gap: 24px; margin-top: 10px !important; }
  .indice a { text-decoration: none; }
  .indice a:hover { text-decoration: underline; }
  [id^="reg-"] { scroll-margin-top: 70px; }

  /* ---------- Finestre popup ---------- */
  dialog {
    border: 1px solid var(--brass); border-radius: 14px; padding: 0; color: var(--text);
    background: linear-gradient(180deg, var(--card-2), var(--card));
    width: min(640px, calc(100vw - 24px)); max-height: calc(100vh - 40px);
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  dialog::backdrop { background: rgba(0,0,0,.7); backdrop-filter: blur(3px); }
  dialog[open] { display: flex; flex-direction: column; animation: comparsa .25s ease; }
  .popup-testa {
    display: flex; align-items: flex-start; gap: 12px; padding: 16px 18px 12px;
    border-bottom: 1px solid var(--line);
  }
  .popup-testa .titolo { font-size: 1.15rem; color: var(--gold-hi); }
  .popup-testa .meta { color: var(--muted); font-size: .85rem; }
  .chiudi {
    margin-left: auto; flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--line); background: transparent; color: var(--text);
    font-size: 1.1rem; cursor: pointer;
  }
  .chiudi:hover { border-color: var(--gold); color: var(--gold); }
  .popup-corpo { padding: 14px 18px 18px; overflow-y: auto; }

  .lista-deck { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 28px; }
  .lista-deck h4 {
    margin: 0 0 6px; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
    font-family: Inter, system-ui, sans-serif; font-weight: 600;
  }
  .lista-deck ul { list-style: none; margin: 0 0 14px; padding: 0; }
  .lista-deck li { display: flex; gap: 10px; padding: 3px 0; border-bottom: 1px dashed rgba(38,58,88,.7); font-size: .92rem; }
  .lista-deck .qta { color: var(--gold); font-weight: 600; min-width: 18px; text-align: right; font-variant-numeric: tabular-nums; }
  .lista-deck a { color: var(--text); text-decoration: none; }
  .lista-deck a:hover { color: var(--gold-hi); text-decoration: underline; }
  @media (max-width: 520px) { .lista-deck { grid-template-columns: 1fr; } }
  .testo-grezzo { white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; font-size: .85rem; margin: 0; }
  .tab-tappa { font-size: .88rem; }
  .tab-tappa th, .tab-tappa td { padding: 7px 10px; white-space: nowrap; }
  .tab-tappa tbody tr:nth-child(-n+3) td { color: var(--gold-hi); }

  /* Visualizzatore foto */
  #galleria {
    width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0;
    border: 0; border-radius: 0; background: #03060c;
  }
  #galleria[open] { display: grid; place-items: center; }
  #galleria img { max-width: 94vw; max-height: 84vh; object-fit: contain; border-radius: 6px; user-select: none; }
  #galleria .chiudi { position: absolute; top: 14px; right: 14px; background: rgba(0,0,0,.5); }
  .freccia {
    position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 50%;
    border: 1px solid var(--line); background: rgba(0,0,0,.5); color: var(--text); font-size: 1.4rem; cursor: pointer;
  }
  .freccia:hover { border-color: var(--gold); color: var(--gold); }
  .freccia.sx { left: 12px; } .freccia.dx { right: 12px; }
  #galleria .contatore { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; color: var(--muted); font-size: .9rem; }

  footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 0 16px 32px; }
  footer .aggiornato { margin-bottom: 4px; }
  .errore { background: #2a1314; border-color: #6b2e36; }

  @media (max-width: 520px) {
    .nascondi-mobile { display: none; }
    .indice { columns: 1; }
    th, td { padding: 10px; }
    .freccia { top: auto; bottom: 8px; transform: none; }
  }

  /* Selettore lingua */
  header { position: relative; }
  .lingua {
    position: absolute; top: 14px; right: 16px; display: flex; gap: 2px; padding: 3px;
    border: 1px solid var(--line); border-radius: 999px; background: rgba(7,11,20,.6);
  }
  .lingua button {
    font: inherit; font-size: .75rem; font-weight: 600; letter-spacing: .06em; cursor: pointer;
    border: 0; border-radius: 999px; padding: 4px 10px; background: transparent; color: var(--muted);
  }
  .lingua button.attivo { background: var(--gold); color: #07111f; }

  /* Info utili */
  .info-testo { white-space: normal; }
  .info-testo p { margin: 0 0 8px; }
  .info-testo p:last-child { margin-bottom: 0; }

/* =====================================================================
   SPLASH "Premodern delle Lande Desolate" — CSS
   Tutti i selettori iniziano con "splash-". Nessuna dipendenza esterna.
   Timeline (da quando il logo è caricato):
     0.00s  stelle + aurora
     0.15s  logo da sfocato a nitido (0.9s) + alone
     0.60s  anello di brina, poi cristalli di ghiaccio
     1.05s  bagliore che percorre il bordo argentato
     1.50s  stellina zaffiro ✦
     2.05s  dissolvenza dell'overlay (0.45s) → fine a 2.5s
   ===================================================================== */

/* Blocca lo scroll della pagina mentre lo splash è visibile */
html.splash-lock { overflow: hidden; }

#splash-overlay {
  /* Palette */
  --splash-night: #070b14;
  --splash-deep: #132036;
  --splash-line: #263a58;
  --splash-ice: #8fd3ec;
  --splash-ice-light: #dff4fc;
  --splash-steel: #4f86c6;
  --splash-sapphire: #3d6fe0;
  --splash-aurora: 46, 196, 160;
  --splash-text: #e8f0f8;
  /* Dimensione del sigillo (limitata anche in altezza per i telefoni in orizzontale) */
  --splash-size: min(300px, 70vw, 62vh);

  position: fixed;
  inset: 0;
  z-index: 2147483000;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  cursor: pointer;
  background:
    radial-gradient(ellipse 70% 55% at 50% 55%, var(--splash-deep) 0%, rgba(19, 32, 54, 0) 70%),
    var(--splash-night);
  opacity: 1;
  transition: opacity .45s ease, visibility .45s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
#splash-overlay.splash-hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

/* ---------- Stelle (generate dal JS) ---------- */
.splash-stars { position: absolute; inset: 0; pointer-events: none; }
.splash-star {
  position: absolute;
  width: var(--s, 2px);
  height: var(--s, 2px);
  border-radius: 50%;
  background: var(--splash-ice-light);
  box-shadow: 0 0 4px rgba(143, 211, 236, .8);
  opacity: 0;
  animation: splash-star-in .9s ease-out var(--d, 0s) forwards;
}
.splash-star.splash-star-blue { background: var(--splash-steel); box-shadow: 0 0 5px var(--splash-sapphire); }
@keyframes splash-star-in { to { opacity: var(--o, .7); } }

/* ---------- Aurora (due veli di gradiente che ondeggiano) ---------- */
.splash-aurora {
  position: absolute;
  left: -25%;
  right: -25%;
  top: -12%;
  height: 58%;
  pointer-events: none;
  opacity: 0;
  background:
    radial-gradient(ellipse 38% 42% at 32% 45%, rgba(var(--splash-aurora), .30), rgba(var(--splash-aurora), 0) 70%),
    radial-gradient(ellipse 34% 30% at 64% 34%, rgba(143, 211, 236, .20), rgba(143, 211, 236, 0) 70%),
    radial-gradient(ellipse 30% 26% at 80% 52%, rgba(var(--splash-aurora), .16), rgba(var(--splash-aurora), 0) 70%);
  animation:
    splash-fade-in 1s ease-out forwards,
    splash-aurora-wave 3.2s ease-in-out infinite alternate;
}
.splash-aurora.splash-aurora-b {
  top: -4%;
  transform: scaleX(-1);
  animation:
    splash-fade-in-soft 1.2s ease-out .2s forwards,
    splash-aurora-wave-b 3.8s ease-in-out infinite alternate;
}
@keyframes splash-fade-in { to { opacity: 1; } }
@keyframes splash-fade-in-soft { to { opacity: .55; } }
@keyframes splash-aurora-wave {
  from { transform: translateX(-4%) skewX(-8deg); }
  to   { transform: translateX(4%)  skewX(6deg); }
}
@keyframes splash-aurora-wave-b {
  from { transform: scaleX(-1) translateX(3%)  skewX(5deg); }
  to   { transform: scaleX(-1) translateX(-3%) skewX(-7deg); }
}

/* ---------- Sigillo: contenitore ---------- */
.splash-seal {
  position: relative;
  width: var(--splash-size);
  height: var(--splash-size);
  flex: 0 0 auto;
}

/* Alone luminoso dietro il logo */
.splash-halo {
  position: absolute;
  inset: -22%;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(circle,
    rgba(143, 211, 236, .38) 0%,
    rgba(61, 111, 224, .16) 38%,
    rgba(61, 111, 224, 0) 66%);
  opacity: 0;
  transform: scale(.7);
}

/* Logo (il tuo PNG, non ridisegnato) */
.splash-logo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  opacity: 0;
  transform: scale(.88);
  filter: blur(10px);
  will-change: transform, opacity, filter;
  -webkit-user-drag: none;
}

/* Anello di brina: tacche sottili disposte in cerchio attorno al sigillo */
.splash-frost {
  position: absolute;
  inset: -7%;
  border-radius: 50%;
  pointer-events: none;
  opacity: 0;
  background: repeating-conic-gradient(rgba(223, 244, 252, .75) 0deg 0.8deg, rgba(223, 244, 252, 0) 0.8deg 5deg);
  -webkit-mask: radial-gradient(circle closest-side, transparent 93%, #000 94% 97%, transparent 98%);
          mask: radial-gradient(circle closest-side, transparent 93%, #000 94% 97%, transparent 98%);
  filter: drop-shadow(0 0 4px rgba(143, 211, 236, .7));
}

/* Cristalli di ghiaccio (12, disposti in cerchio tramite --a) */
.splash-crystal {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 6px;
  height: 15px;
  margin: -7.5px 0 0 -3px;
  pointer-events: none;
  background: linear-gradient(180deg, var(--splash-ice-light), var(--splash-ice) 55%, var(--splash-steel));
  clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
  opacity: 0;
  transform: rotate(var(--a)) translateY(calc(var(--splash-size) * -.585)) scale(0);
}

/* Bagliore che percorre il bordo argentato (mascherato sulla sola corona) */
.splash-shine {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  pointer-events: none;
  opacity: 0;
  background: conic-gradient(from 0deg,
    rgba(223, 244, 252, 0) 0deg,
    rgba(223, 244, 252, 0) 300deg,
    rgba(223, 244, 252, .9) 345deg,
    rgba(223, 244, 252, 0) 360deg);
  -webkit-mask: radial-gradient(circle closest-side, transparent 60%, #000 63% 95%, transparent 99%);
          mask: radial-gradient(circle closest-side, transparent 60%, #000 63% 95%, transparent 99%);
  mix-blend-mode: screen;
}

/* Stellina zaffiro a quattro punte, sulla gemma in alto del sigillo */
.splash-spark {
  position: absolute;
  left: 50%;
  top: 4.4%;
  width: 22%;
  height: 22%;
  margin: -11% 0 0 -11%;
  pointer-events: none;
  opacity: 0;
  transform: scale(0) rotate(-30deg);
  filter: drop-shadow(0 0 6px rgba(61, 111, 224, .95)) drop-shadow(0 0 14px rgba(143, 211, 236, .6));
}
.splash-spark svg { display: block; width: 100%; height: 100%; }

/* ---------- Riproduzione: parte quando il JS aggiunge .splash-play ---------- */
.splash-play .splash-logo    { animation: splash-focus .9s cubic-bezier(.2, .7, .2, 1) .15s both; }
.splash-play .splash-halo    { animation: splash-halo 1.1s ease-out .25s both; }
.splash-play .splash-frost   { animation: splash-frost 1s ease-out .6s both; }
.splash-play .splash-crystal { animation: splash-crystal .55s ease-out calc(.7s + var(--i) * 35ms) both; }
.splash-play .splash-shine   { animation: splash-shine .75s ease-in-out 1.05s both; }
.splash-play .splash-spark   { animation: splash-spark .6s ease-out 1.5s both; }

@keyframes splash-focus {
  0%   { opacity: 0; transform: scale(.88); filter: blur(10px); }
  45%  { opacity: 1; }
  100% { opacity: 1; transform: scale(1);   filter: blur(0); }
}
@keyframes splash-halo {
  0%   { opacity: 0;   transform: scale(.7); }
  60%  { opacity: 1;   transform: scale(1.04); }
  100% { opacity: .75; transform: scale(1); }
}
@keyframes splash-frost {
  0%   { opacity: 0;   transform: scale(1.12) rotate(-25deg); }
  55%  { opacity: .95; }
  100% { opacity: .5;  transform: scale(1) rotate(0deg); }
}
@keyframes splash-crystal {
  0%   { opacity: 0;  transform: rotate(var(--a)) translateY(calc(var(--splash-size) * -.62))  scale(0); }
  60%  { opacity: 1;  transform: rotate(var(--a)) translateY(calc(var(--splash-size) * -.585)) scale(1.15); }
  100% { opacity: .8; transform: rotate(var(--a)) translateY(calc(var(--splash-size) * -.585)) scale(1); }
}
@keyframes splash-shine {
  0%   { opacity: 0; transform: rotate(-40deg); }
  20%  { opacity: 1; }
  80%  { opacity: 1; }
  100% { opacity: 0; transform: rotate(320deg); }
}
@keyframes splash-spark {
  0%   { opacity: 0; transform: scale(0)   rotate(-30deg); }
  45%  { opacity: 1; transform: scale(1.2) rotate(10deg); }
  100% { opacity: 0; transform: scale(.4)  rotate(45deg); }
}

/* ---------- Movimento ridotto: logo fermo + breve dissolvenza ---------- */
@media (prefers-reduced-motion: reduce) {
  #splash-overlay, #splash-overlay * { animation: none !important; }
  #splash-overlay { transition-duration: .25s; }
  .splash-logo   { opacity: 1; transform: none; filter: none; }
  .splash-halo   { opacity: .6; transform: none; }
  .splash-aurora { opacity: .6; }
  .splash-frost, .splash-crystal, .splash-shine, .splash-spark { display: none; }
}
</style>
</head>
<body>
<!-- ===================== SPLASH di apertura ===================== -->
<div id="splash-overlay" aria-hidden="true">
  <div class="splash-stars"></div>
  <div class="splash-aurora"></div>
  <div class="splash-aurora splash-aurora-b"></div>
  <div class="splash-seal">
    <div class="splash-halo"></div>
    <img class="splash-logo" src="splash-logo.png" alt="" decoding="async" draggable="false">
    <div class="splash-frost"></div>
    <div class="splash-shine"></div>
    <div class="splash-spark">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <radialGradient id="splash-spark-grad" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#dff4fc"/>
            <stop offset=".45" stop-color="#8fd3ec"/>
            <stop offset="1" stop-color="#3d6fe0"/>
          </radialGradient>
        </defs>
        <path d="M50 0 C54 38 62 46 100 50 C62 54 54 62 50 100 C46 62 38 54 0 50 C38 46 46 38 50 0 Z" fill="url(#splash-spark-grad)"/>
      </svg>
    </div>
  </div>
</div>
<script>
/* Splash: parte subito, prima del resto della pagina */
(function () {
  var ov = document.getElementById("splash-overlay");
  if (!ov) return;

  // Solo alla prima apertura nella sessione
  var giaVisto = false;
  try { giaVisto = sessionStorage.getItem("splash-visto") === "1"; } catch (e) {}
  if (giaVisto) { ov.parentNode.removeChild(ov); return; }
  try { sessionStorage.setItem("splash-visto", "1"); } catch (e) {}

  var html = document.documentElement;
  html.classList.add("splash-lock");
  var ridotto = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Stelle sparse (meno sui telefoni)
  var cielo = ov.querySelector(".splash-stars");
  var quante = window.innerWidth < 600 ? 45 : 85;
  for (var i = 0; i < quante; i++) {
    var s = document.createElement("span");
    s.className = "splash-star" + (Math.random() < .22 ? " splash-star-blue" : "");
    s.style.left = (Math.random() * 100).toFixed(2) + "%";
    s.style.top = (Math.pow(Math.random(), 1.4) * 100).toFixed(2) + "%";   // un po' più fitte in alto
    s.style.setProperty("--s", (1 + Math.random() * 1.8).toFixed(2) + "px");
    s.style.setProperty("--d", (Math.random() * .9).toFixed(2) + "s");
    s.style.setProperty("--o", (.35 + Math.random() * .55).toFixed(2));
    cielo.appendChild(s);
  }

  // Dodici cristalli di ghiaccio in cerchio attorno al sigillo
  var sigillo = ov.querySelector(".splash-seal");
  for (var k = 0; k < 12; k++) {
    var c = document.createElement("span");
    c.className = "splash-crystal";
    c.style.setProperty("--a", (k * 30) + "deg");
    c.style.setProperty("--i", k);
    sigillo.appendChild(c);
  }

  var chiuso = false, partito = false, timer = null;
  function chiudi() {
    if (chiuso) return;
    chiuso = true;
    clearTimeout(timer);
    ov.classList.add("splash-hide");
    html.classList.remove("splash-lock");
    document.removeEventListener("keydown", tasto);
    setTimeout(function () { if (ov.parentNode) ov.parentNode.removeChild(ov); }, 500);
  }
  function tasto(e) { if (e.key === "Escape" || e.key === "Esc") chiudi(); }
  function parti() {
    if (partito || chiuso) return;
    partito = true;
    ov.classList.add("splash-play");
    timer = setTimeout(chiudi, ridotto ? 600 : 2050);   // dissolvenza dopo 2,05 s → fine a 2,5 s
  }

  ov.addEventListener("click", chiudi);
  document.addEventListener("keydown", tasto);

  // La sequenza parte quando il logo è caricato (con rete lenta, al massimo dopo 1,5 s)
  var logo = ov.querySelector(".splash-logo");
  if (logo.complete && logo.naturalWidth) parti();
  else {
    logo.addEventListener("load", parti);
    logo.addEventListener("error", chiudi);
    setTimeout(parti, 1500);
  }
  setTimeout(chiudi, 5000);   // rete di sicurezza: lo splash non resta mai bloccato
})();
</script>

<script>
  /* ================= Testi dell'interfaccia nelle due lingue ================= */
  const TESTI = {

      deck_vuote: "Le decklist arriveranno dopo la prima tappa.", vedi_lista: "Vedi lista",
      main: "Main deck", side: "Sideboard", copia: "Copia lista", copiata: "Copiata ✓", copia_ko: "Copia non riuscita",
      lista_nd: "Lista non disponibile.", info_vuote: "Nessuna informazione per ora.",
      stagione: "Stagione", aggiornato_il: "aggiornato il", ultimo_agg: "Ultimo aggiornamento",
      errore: `Non riesco a leggere <strong>data.json</strong>.<br>Se hai aperto il file con un doppio clic dal computer è normale:
        il browser blocca la lettura dei file locali. Se invece sei online, probabilmente c'è un errore di sintassi nel file.`,
    },
    en: {
      nav_news: "News", nav_classifica: "Standings", nav_eventi: "Events", nav_decklist: "Decklists",
      nav_regolamento: "Rules", nav_info: "Useful info", nav_contatti: "Contacts",
      tit_news: "Latest news", tit_classifica: "Overall standings", tit_eventi: "Schedule",
      tit_decklist: "Winning decklists", tit_regolamento: "Rules", tit_info: "Useful info", tit_contatti: "Contacts",
      col_giocatore: "Player", col_punti: "Points", col_vsp: "W-L-D",
      cerca: "Search by first name, last name or nickname",
      prossima: "Next event", oggi: "It's today!", domani: "Tomorrow!", mancano: n => `${n} days to go`, ore: "at",
      class_vuota: "The standings will start with the first event.", nessuno: q => `No player found for “${q}”.`,
      eventi_vuoti: "No events scheduled.", passati: "Past events",
      btn_classifica: "🏆 Event standings", btn_decklist_evento: "📋 Event decklists ↗", classifica_di: "Standings",
      deck_vuote: "Decklists will be published after the first event.", vedi_lista: "View list",
      main: "Main deck", side: "Sideboard", copia: "Copy list", copiata: "Copied ✓", copia_ko: "Copy failed",
      lista_nd: "List not available.", info_vuote: "No information yet.",
      stagione: "Season", aggiornato_il: "updated on", ultimo_agg: "Last updated",
      errore: `Unable to read <strong>data.json</strong>. If you opened the file by double-clicking it on your computer this is normal;
        if you are online there is probably a syntax error in the file.`,
    },
  };

  /* ================= Lingua ================= */
  const leggiLingua = () => { try { return localStorage.getItem("lingua"); } catch { return null; } };
  let lang = leggiLingua() || ((navigator.language || "it").toLowerCase().startsWith("it") ? "it" : "en");
  const T = k => TESTI[lang][k];
  // Testo di un contenuto nella lingua scelta (campo "_en"), con ripiego sull'italiano
  const tr = (o, campo) => (lang === "en" && o && String(o[campo + "_en"] || "").trim()) ? o[campo + "_en"] : (o ? o[campo] : "");
  // "1° posto" → "1st place", "3°-4° posto" → "3rd-4th place"
  const ordinale = n => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ({ 1: "st", 2: "nd", 3: "rd" }[n % 10] || "th"));
  const piazzamento = s => lang === "en" ? String(s || "").replace(/(\d+)°/g, (_, n) => ordinale(+n)).replace(/\bposto\b/gi, "place") : s;

  /* ================= Strumenti ================= */
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const locale = () => lang === "en" ? "en-GB" : "it-IT";
  const giorno = d => new Date(String(d).slice(0, 10) + "T00:00");
  const dataBreve = d => giorno(d).toLocaleDateString(locale(), { weekday: "short", day: "numeric", month: "long" });
  const dataLunga = d => giorno(d).toLocaleDateString(locale(), { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const vuoto = testo => `<div class="card vuoto">${testo}</div>`;
  const linkSicuro = u => { u = String(u || "").trim(); if (!u) return ""; return /^https?:\/\//i.test(u) ? u : "https://" + u; };
  const normalizza = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  // Testo con a capo e link cliccabili (indirizzi web ed e-mail)
  const testoRicco = s => esc(s).split(/\n{2,}/).map(par => "<p>" + par
      .replace(/(https?:\/\/[^\s<]+|www\.[^\s<]+)/g, u => `<a href="${linkSicuro(u.replace(/[.,;:)]+$/, ""))}" target="_blank" rel="noopener">${u}</a>`)
      .replace(/([\w.+-]+@[\w-]+\.[\w.-]+\w)/g, m => `<a href="mailto:${m}">${m}</a>`)
      .replace(/\n/g, "<br>") + "</p>").join("");

  /* ================= Navigazione ================= */
  const mostra = id => {
    document.querySelectorAll("nav button, section").forEach(el => el.classList.remove("attivo"));
    document.querySelector(`nav button[data-sezione="${id}"]`).classList.add("attivo");
    $(id).classList.add("attivo");
  };
  document.querySelectorAll("nav button").forEach(btn => btn.addEventListener("click", () => mostra(btn.dataset.sezione)));

  /* ================= Popup ================= */
  document.querySelectorAll("dialog").forEach(dl => {
    dl.addEventListener("click", e => { if (e.target === dl || e.target.closest("[data-chiudi]")) dl.close(); });
  });
  function apriPopup(titolo, meta, html) {
    $("popup-titolo").textContent = titolo;
    $("popup-meta").textContent = meta || "";
    $("popup-corpo").innerHTML = html;
    $("popup").showModal();
    $("popup-corpo").scrollTop = 0;
  }

  /* ================= Decklist: lettura del testo incollato ================= */
  // Accetta "4 Lightning Bolt", "4x Lightning Bolt", una riga "Sideboard" (o "SB: 2 Carta"),
  // oppure il formato MTGO/Arena con una riga vuota prima della sideboard.
  function leggiLista(testo) {
    const righe = String(testo || "").replace(/\r/g, "").split("\n").map(r => r.trim());
    const haSegnaposto = righe.some(r => /^(sideboard|side|sb)\s*:?\s*$/i.test(r));
    const main = [], side = [];
    let inSide = false, vistaCarta = false;
    for (const r of righe) {
      if (!r) { if (!haSegnaposto && vistaCarta && main.length) inSide = true; continue; }
      if (/^(sideboard|side|sb)\s*:?\s*$/i.test(r)) { inSide = true; continue; }
      if (/^(deck|main|maindeck|mainboard|companion)\s*:?\s*$/i.test(r)) continue;
      let riga = r, sb = false;
      const m0 = riga.match(/^sb:\s*(.*)$/i); if (m0) { riga = m0[1]; sb = true; }
      const m = riga.match(/^(\d+)\s*x?\s+(.+)$/i);
      const carta = m ? { n: +m[1], nome: m[2].trim() } : { n: 1, nome: riga };
      (inSide || sb ? side : main).push(carta);
      vistaCarta = true;
    }
    return { main, side };
  }
  const totale = l => l.reduce((s, c) => s + c.n, 0);
  const scryfall = nome => "https://scryfall.com/search?q=" + encodeURIComponent('!"' + nome + '"');
  const bloccoLista = (titolo, l) => l.length ? `<div><h4>${titolo} (${totale(l)})</h4><ul>${l.map(c =>
    `<li><span class="qta">${c.n}</span><a href="${scryfall(c.nome)}" target="_blank" rel="noopener">${esc(c.nome)}</a></li>`).join("")}</ul></div>` : "";

  function apriDecklist(k) {
    const { main, side } = leggiLista(k.lista);
    const html = main.length || side.length
      ? `<div class="lista-deck">${bloccoLista(T("main"), main)}${bloccoLista(T("side"), side)}</div>
         <div class="azioni"><button class="btn" id="copia-lista">${T("copia")}</button></div>`
      : `<p class="muted">${T("lista_nd")}</p>`;
    apriPopup(`${k.mazzo || "Decklist"} — ${k.giocatore || ""}`, [k.torneo, piazzamento(k.piazzamento)].filter(Boolean).join(" · "), html);
    const b = $("copia-lista");
    if (b) b.onclick = async () => {
      try { await navigator.clipboard.writeText(k.lista.trim()); b.textContent = T("copiata"); }
      catch { b.textContent = T("copia_ko"); }
    };
  }

  /* ================= Classifica di tappa: lettura del testo incollato ================= */
  // Se il testo arriva da una tabella (colonne separate da tab o da più spazi) diventa una tabella,
  // altrimenti viene mostrato così com'è.
  function tabellaDaTesto(testo) {
    const righe = String(testo || "").replace(/\r/g, "").split("\n").filter(r => r.trim());
    if (!righe.length) return "";
    let sep = null;
    if (righe.some(r => r.includes("\t"))) sep = /\t/;
    else if (righe.filter(r => /\S {2,}\S/.test(r)).length >= Math.ceil(righe.length * .6)) sep = / {2,}/;
    else if (righe.every(r => r.includes(";"))) sep = /;/;
    if (!sep) return `<pre class="testo-grezzo">${esc(righe.join("\n"))}</pre>`;
    const celle = righe.map(r => r.split(sep).map(c => c.trim()));
    const intest = !/^\d+[.°)]?$/.test(celle[0][0]) ? celle.shift() : null;
    return `<div class="scroll"><table class="tab-reg tab-tappa">
      ${intest ? `<thead><tr>${intest.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead>` : ""}
      <tbody>${celle.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody>
    </table></div>`;
  }

  /* ================= Galleria foto ================= */
  let galleria = [], fotoAttuale = 0;
  function mostraFoto(i) {
    fotoAttuale = (i + galleria.length) % galleria.length;
    $("galleria-img").src = galleria[fotoAttuale];
    $("galleria-contatore").textContent = galleria.length > 1 ? `${fotoAttuale + 1} / ${galleria.length}` : "";
    $("foto-prec").hidden = $("foto-succ").hidden = galleria.length < 2;
  }
  function apriGalleria(foto, i) { galleria = foto; mostraFoto(i); $("galleria").showModal(); }
  $("foto-prec").onclick = e => { e.stopPropagation(); mostraFoto(fotoAttuale - 1); };
  $("foto-succ").onclick = e => { e.stopPropagation(); mostraFoto(fotoAttuale + 1); };
  $("galleria").addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") mostraFoto(fotoAttuale - 1);
    if (e.key === "ArrowRight") mostraFoto(fotoAttuale + 1);
  });
  let xInizio = null;
  $("galleria").addEventListener("touchstart", e => { xInizio = e.touches[0].clientX; }, { passive: true });
  $("galleria").addEventListener("touchend", e => {
    if (xInizio === null || galleria.length < 2) return;
    const dx = e.changedTouches[0].clientX - xInizio; xInizio = null;
    if (Math.abs(dx) > 40) mostraFoto(fotoAttuale + (dx < 0 ? 1 : -1));
  });
  function grigliaFoto(foto, idNews) {
    if (!foto || !foto.length) return "";
    const visibili = foto.slice(0, 6), extra = foto.length - visibili.length;
    const classe = foto.length === 1 ? "n1" : foto.length === 2 || foto.length === 4 ? "n2" : "n3";
    return `<div class="foto ${classe}">${visibili.map((f, i) => `
      <button data-news="${idNews}" data-i="${i}" aria-label="Foto ${i + 1}">
        <img src="${esc(f)}" alt="" loading="lazy">
        ${i === visibili.length - 1 && extra > 0 ? `<span class="altre">+${extra}</span>` : ""}
      </button>`).join("")}</div>`;
  }

  /* ================= Disegno della pagina ================= */
  let D = null;                    // dati del sito
  let regoleEn = null;             // regolamento in inglese (caricato solo se serve)
  let news = [], ordineEventi = [], decklist = [], classificaOrdinata = [];

  function disegnaClassifica() {
    const filtro = $("cerca-giocatore").value;
    const f = normalizza(filtro).trim();
    const righe = f ? classificaOrdinata.filter(g => normalizza(g.giocatore + " " + (g.nickname || "")).includes(f)) : classificaOrdinata;
    $("tabella-classifica").innerHTML = !classificaOrdinata.length
      ? `<tr><td colspan="4" class="vuoto">${T("class_vuota")}</td></tr>`
      : !righe.length
      ? `<tr><td colspan="4" class="vuoto">${esc(T("nessuno")(filtro))}</td></tr>`
      : righe.map(g => `
        <tr><td><span class="pos pos-${g.pos}">${g.pos}</span></td>
        <td>${esc(g.giocatore)}${g.nickname ? `<span class="nick">${esc(g.nickname)}</span>` : ""}</td>
        <td class="num punti">${g.punti}</td>
        <td class="num nascondi-mobile">${g.vittorie}-${g.sconfitte}-${g.pareggi}</td></tr>`).join("");
  }

  function disegnaRegolamento(reg) {
    if (!reg) { $("contenuto-regolamento").innerHTML = ""; return; }
    const lista = voci => voci.map(v => `<li>${esc(v)}</li>`).join("");
    const blocco = b => {
      switch (b.tipo) {
        case "paragrafo":      return `<p>${esc(b.testo)}</p>`;
        case "sottotitolo":    return `<h4>${esc(b.testo)}</h4>`;
        case "elenco":         return `<ul>${lista(b.voci)}</ul>`;
        case "elencoNumerato": return `<ol>${lista(b.voci)}</ol>`;
        case "formula":        return `<p class="formula">${esc(b.testo)}</p>`;
        case "esempio":        return `<p class="esempio"><strong>${lang === "en" ? "Example" : "Esempio"}:</strong> ${esc(b.testo)}</p>`;
        case "tabella":        return `<div class="scroll"><table class="tab-reg">
          <thead><tr>${b.intestazioni.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
          <tbody>${b.righe.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody>
          </table></div>`;
        default: return "";
      }
    };
    $("contenuto-regolamento").innerHTML = `
      <div class="card"><strong>${esc(reg.titolo)}</strong>
        <div class="meta">${T("stagione")} ${esc(reg.stagione)} · ${T("aggiornato_il")} ${esc(reg.ultimoAggiornamento)}</div>
        <ol class="indice">${reg.sezioni.map(s => `<li><a href="#reg-${esc(s.id)}">${esc(s.titolo)}</a></li>`).join("")}</ol>
      </div>
      ${reg.sezioni.map(s => `
        <div class="card" id="reg-${esc(s.id)}">
          <h3>${s.numero}. ${esc(s.titolo)}</h3>
          ${s.blocchi.map(blocco).join("")}
        </div>`).join("")}`;
  }

  function disegna() {
    const d = D;
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach(el => el.textContent = T(el.dataset.t));
    document.querySelectorAll(".lingua button").forEach(b => b.classList.toggle("attivo", b.dataset.lang === lang));
    $("cerca-giocatore").placeholder = T("cerca");
    $("cerca-giocatore").setAttribute("aria-label", T("cerca"));

    $("titolo").textContent = d.nomeLega;
    $("sottotitolo").textContent = tr(d, "sottotitolo");
    document.title = d.nomeLega;

    // Prossima tappa in evidenza
    const oggi = new Date(); oggi.setHours(0, 0, 0, 0);
    const eventi = d.eventi || [];
    const futuri = eventi.filter(e => giorno(e.data) >= oggi).sort((a, b) => a.data.localeCompare(b.data));
    const passati = eventi.filter(e => giorno(e.data) < oggi).sort((a, b) => b.data.localeCompare(a.data));
    ordineEventi = [...futuri, ...passati];
    if (futuri.length) {
      const e = futuri[0];
      const gg = Math.round((giorno(e.data) - oggi) / 86400000);
      $("prossima-tappa").innerHTML = `
        <div class="card prossima">
          <div class="etichetta">${T("prossima")}</div>
          <div class="nome">${esc(e.nome)}</div>
          <div class="meta">${dataLunga(e.data)} · ${T("ore")} ${esc(e.ora)}</div>
          <div>${esc(e.luogo)}</div>
          <div class="giorni">${gg === 0 ? T("oggi") : gg === 1 ? T("domani") : T("mancano")(gg)}</div>
        </div>`;
    } else $("prossima-tappa").innerHTML = "";

    // News con foto
    news = d.news || [];
    $("lista-news").innerHTML = news.map((n, i) => `
      <div class="card"><strong>${esc(tr(n, "titolo"))}</strong>
      <div class="meta">${dataBreve(n.data)}</div><div class="info-testo">${testoRicco(tr(n, "testo"))}</div>
      ${grigliaFoto(n.foto, i)}</div>`).join("");

    // Classifica
    classificaOrdinata = [...(d.classifica || [])].sort((a, b) => b.punti - a.punti).map((g, i) => ({ ...g, pos: i + 1 }));
    disegnaClassifica();

    // Eventi: prima i prossimi, poi quelli passati
    const cardEvento = (e, passato) => {
      const i = ordineEventi.indexOf(e), note = tr(e, "note");
      return `
      <div class="card ${passato ? "passato" : ""}"><strong>${esc(e.nome)}</strong>
      <div class="meta">${dataBreve(e.data)} · ${T("ore")} ${esc(e.ora)} · ${esc(e.formato)}</div>
      <div>${esc(e.luogo)}${note ? (e.luogo ? " — " : "") + esc(note) : ""}</div>
      ${e.classifica || e.linkDecklist ? `<div class="azioni">
        ${e.classifica ? `<button class="btn" data-evento="${i}">${T("btn_classifica")}</button>` : ""}
        ${e.linkDecklist ? `<a class="btn" href="${esc(linkSicuro(e.linkDecklist))}" target="_blank" rel="noopener">${T("btn_decklist_evento")}</a>` : ""}
      </div>` : ""}
      </div>`;
    };
    $("lista-eventi").innerHTML = !eventi.length ? vuoto(T("eventi_vuoti"))
      : futuri.map(e => cardEvento(e, false)).join("")
        + (passati.length ? `<h2 class="secondario">${T("passati")}</h2>` + passati.map(e => cardEvento(e, true)).join("") : "");

    // Decklist con popup
    decklist = d.decklist || [];
    $("lista-decklist").innerHTML = decklist.length
      ? decklist.map((k, i) => `
        <div class="card deck"><div><strong>${esc(k.mazzo)}</strong> — ${esc(k.giocatore)}
        <div class="meta">${esc(k.torneo)}</div>
        ${k.lista && k.lista.trim() ? `<div class="azioni"><button class="btn" data-deck="${i}">${T("vedi_lista")}</button></div>` : ""}</div>
        <span class="badge">${esc(piazzamento(k.piazzamento))}</span></div>`).join("")
      : vuoto(T("deck_vuote"));

    // Regolamento (in inglese se disponibile)
    disegnaRegolamento(lang === "en" && regoleEn ? regoleEn : d.regole);
    if (lang === "en" && !regoleEn) {
      fetch("regolamento_en.json?v=" + Date.now(), { cache: "no-store" })
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(r => { regoleEn = r; if (lang === "en") disegnaRegolamento(r); })
        .catch(() => {});
    }

    // Info utili
    const info = d.info || [];
    $("lista-info").innerHTML = info.length
      ? info.map(x => `<div class="card"><h3>${esc(tr(x, "titolo"))}</h3><div class="info-testo">${testoRicco(tr(x, "testo"))}</div></div>`).join("")
      : vuoto(T("info_vuote"));

    // Contatti
    $("contenuto-contatti").innerHTML = `
      <div class="card"><ul>${(d.contatti || []).map(c => `<li><strong>${esc(tr(c, "nome"))}</strong>: ${c.link
        ? `<a href="${esc(linkSicuro(c.link))}" target="_blank" rel="noopener">${esc(tr(c, "testo"))}</a>` : esc(tr(c, "testo"))}</li>`).join("")}</ul></div>`;

    $("aggiornato").textContent = T("ultimo_agg") + ": " + dataBreve(d.ultimoAggiornamento);
  }

  /* ================= Interazioni (impostate una volta sola) ================= */
  $("cerca-giocatore").addEventListener("input", disegnaClassifica);
  $("lista-news").addEventListener("click", e => {
    const b = e.target.closest("button[data-news]"); if (!b) return;
    apriGalleria(news[b.dataset.news].foto, +b.dataset.i);
  });
  $("lista-eventi").addEventListener("click", ev => {
    const b = ev.target.closest("button[data-evento]"); if (!b) return;
    const e = ordineEventi[b.dataset.evento];
    apriPopup(`${T("classifica_di")} — ${e.nome}`, `${dataLunga(e.data)}${e.luogo ? " · " + e.luogo : ""}`, tabellaDaTesto(e.classifica));
  });
  $("lista-decklist").addEventListener("click", e => {
    const b = e.target.closest("button[data-deck]"); if (b) apriDecklist(decklist[b.dataset.deck]);
  });
  document.querySelectorAll(".lingua button").forEach(b => b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try { localStorage.setItem("lingua", lang); } catch {}
    if (D) disegna(); else document.querySelectorAll("[data-t]").forEach(el => el.textContent = T(el.dataset.t));
  }));

  /* ================= Caricamento dati ================= */
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = T(el.dataset.t));
  document.querySelectorAll(".lingua button").forEach(b => b.classList.toggle("attivo", b.dataset.lang === lang));
  fetch("data.json?v=" + Date.now(), { cache: "no-store" })
    .then(r => r.json())
    .then(d => { D = d; disegna(); })
    .catch(err => {
      console.error(err);
      $("lista-news").innerHTML = `<div class="card errore">${T("errore")}</div>`;
    });
</script>
</body>
</html>
